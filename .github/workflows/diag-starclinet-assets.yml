name: STARCLINET asset resolution diagnostic
on:
  push:
    branches: [release/starclinet-brand-assets-build27]
    paths: [.github/workflows/diag-starclinet-assets.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Probe approved Canva artwork endpoint without sharing private data
        shell: bash
        env:
          THUMBNAIL_URL: 'https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2Fcb468263-e44e-4665-aacd-56c0c2060c7f/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAOkYWs6cKmpdQgTYhpFfmGUoZL5xeF4q-DQXwQZeoiSq&exp=1794297656&osig=AAAAAAAAAAAAAAAAAAAAADSAL4n_8v4YJ5CTCCfC7sywhy6oF3sFILRVakZ-9-ci&signer=media-rpc&token=AAIAAU0AJGNiNDY4MjYzLWU0NGUtNDY2NS1hYWNkLTU2YzBjMjA2MGM3ZgAAAAABocR5csACZ6uXfW06_0wWghOqSMxLP8r7qOeaJp5mtpGXBkiaIQ&x-canva-quality=thumbnail'
          HIGHRES_URL: 'https://media.canva.com/v2/image-resize/format:PNG/height:1024/quality:100/uri:ifs%3A%2F%2FM%2Fcb468263-e44e-4665-aacd-56c0c2060c7f/watermark:F/width:1024?csig=AAAAAAAAAAAAAAAAAAAAAOkYWs6cKmpdQgTYhpFfmGUoZL5xeF4q-DQXwQZeoiSq&exp=1794297656&osig=AAAAAAAAAAAAAAAAAAAAADSAL4n_8v4YJ5CTCCfC7sywhy6oF3sFILRVakZ-9-ci&signer=media-rpc&token=AAIAAU0AJGNiNDY4MjYzLWU0NGUtNDY2NS1hYWNkLTU2YzBjMjA2MGM3ZgAAAAABocR5csACZ6uXfW06_0wWghOqSMxLP8r7qOeaJp5mtpGXBkiaIQ&x-canva-quality=thumbnail'
        run: |
          python3 - <<'PY'
          import os,urllib.request
          for name in ("THUMBNAIL_URL","HIGHRES_URL"):
              try:
                  req=urllib.request.Request(os.environ[name],headers={"User-Agent":"Mozilla/5.0"})
                  with urllib.request.urlopen(req,timeout=30) as r:
                      blob=r.read()
                      print(name,"status",r.status,"bytes",len(blob),"type",r.headers.get("content-type"))
                      open("/tmp/"+name+".bin","wb").write(blob)
              except Exception as e: print(name,"failed",type(e).__name__,str(e)[:100])
          PY