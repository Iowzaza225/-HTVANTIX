name: HTVANTIX MANUAL SESSION FIX

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        shell: bash
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version

      - name: Check ZIP
        shell: bash
        run: |
          ZIP_FILE="./HTVANTIX_HARDENING_V2_SESSION_PERSIST_FIX.zip"
          echo "===== ROOT FILES ====="
          ls -lah

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ไม่พบ $ZIP_FILE"
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"
          echo "FOUND ZIP: $ZIP_FILE"

      - name: Extract Project
        shell: bash
        run: |
          rm -rf source
          mkdir -p source
          unzip -q "$ZIP_FILE" -d source

          echo "===== XCODE PROJECT ====="
          find source -type d -name "*.xcodeproj" -print

      - name: Fix Duplicate App Init
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          app = Path("source/Client/ThreeOneOSFive/App.swift")
          text = app.read_text(encoding="utf-8")

          # The experimental hardening package added a second init() to the @main App.
          # Keep one init() only and preserve the anti-debug call inside it.
          main = re.search(r'@main\s+struct\s+\w+\s*:\s*App\s*\{', text)
          if not main:
              raise SystemExit("ERROR: ไม่พบ @main App struct")

          start = main.end()
          tail = text[start:]
          inits = list(re.finditer(r'\n\s*init\(\)\s*\{', tail))

          if len(inits) >= 2:
              first_pos = start + inits[0].start()
              second_pos = start + inits[1].start()

              # Find exact second init block using balanced braces.
              brace_open = text.find('{', second_pos)
              depth = 0
              end = None
              for i in range(brace_open, len(text)):
                  if text[i] == '{':
                      depth += 1
                  elif text[i] == '}':
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break

              if end is None:
                  raise SystemExit("ERROR: ปิด block init() ไม่ครบ")

              second_block = text[second_pos:end]
              needs_enforce = "HTVAntiDebug.enforce()" in second_block
              text = text[:second_pos] + text[end:]

              if needs_enforce:
                  # Add enforce to the remaining first init if it isn't already there.
                  first_open = text.find('{', first_pos)
                  depth = 0
                  first_end = None
                  for i in range(first_open, len(text)):
                      if text[i] == '{':
                          depth += 1
                      elif text[i] == '}':
                          depth -= 1
                          if depth == 0:
                              first_end = i
                              break
                  block = text[first_open:first_end+1]
                  if "HTVAntiDebug.enforce()" not in block:
                      text = text[:first_open+1] + "\n        HTVAntiDebug.enforce()" + text[first_open+1:]

              app.write_text(text, encoding="utf-8")
              print("Fixed duplicate init(): PASS")
          else:
              print("Duplicate init() not present; no patch needed")
          PY

      - name: Find Project
        shell: bash
        run: |
          PROJECT="$(find source -type d -name "*.xcodeproj" -print -quit)"

          if [ -z "$PROJECT" ]; then
            echo "ERROR: ไม่พบ Xcode Project"
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "PROJECT: $PROJECT"

      - name: Detect Scheme
        shell: bash
        run: |
          echo "===== PROJECT INFO ====="
          xcodebuild -project "$PROJECT" -list

          SCHEME="$(xcodebuild -project "$PROJECT" -list 2>/dev/null | awk '/Schemes:/{flag=1;next} flag && NF {gsub(/^[ \t]+|[ \t]+$/, ""); print; exit}')"

          if [ -z "$SCHEME" ]; then
            echo "ERROR: ไม่พบ Scheme"
            exit 1
          fi

          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"
          echo "SCHEME: $SCHEME"

      - name: Clean
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/build"
          rm -rf "$GITHUB_WORKSPACE/Payload"
          rm -f "$GITHUB_WORKSPACE/HTVANTIX-MANUAL-SESSION-FIX.ipa"
          rm -f "$GITHUB_WORKSPACE/xcodebuild.log"

      - name: Build HTVANTIX
        shell: bash
        run: |
          set -o pipefail

          echo "===== HTVANTIX MANUAL SESSION FIX ====="
          echo "ZIP     : $ZIP_FILE"
          echo "PROJECT : $PROJECT"
          echo "SCHEME  : $SCHEME"

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build \
            2>&1 | tee "$GITHUB_WORKSPACE/xcodebuild.log"

      - name: Find Built App
        shell: bash
        run: |
          APP_PATH="$(find "$GITHUB_WORKSPACE/build" -type d -path "*Release-iphoneos/*.app" -print -quit)"

          if [ -z "$APP_PATH" ]; then
            APP_PATH="$(find "$GITHUB_WORKSPACE/build" -type d -name "*.app" -print -quit)"
          fi

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: ไม่พบ .app"
            exit 1
          fi

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          echo "APP: $APP_PATH"

      - name: Create IPA
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -qry HTVANTIX-MANUAL-SESSION-FIX.ipa Payload
          ls -lh HTVANTIX-MANUAL-SESSION-FIX.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HTVANTIX-MANUAL-SESSION-FIX-${{ github.run_number }}
          path: HTVANTIX-MANUAL-SESSION-FIX.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Show Errors
        if: failure()
        shell: bash
        run: |
          if [ -f "$GITHUB_WORKSPACE/xcodebuild.log" ]; then
            grep -n -i -E "error:|fatal error:|BUILD FAILED|SwiftCompile|CompileSwift" "$GITHUB_WORKSPACE/xcodebuild.log" | tail -150 || true
          fi

      - name: Upload Build Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: HTVANTIX-MANUAL-SESSION-FIX-LOG-${{ github.run_number }}
          path: xcodebuild.log
          if-no-files-found: ignore
