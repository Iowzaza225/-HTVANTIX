name: HTVINTEX 1.1.5 Build 8

on:
  workflow_dispatch:

jobs:
  build-htvintex:
    name: Build HTVINTEX 1.1.5 B8
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          echo "===== XCODE ====="
          xcodebuild -version

          echo "===== SWIFT ====="
          swift --version

          echo "===== FILES ====="
          find . -maxdepth 3 -type d -name "*.xcodeproj" -print

      - name: Locate Xcode project
        id: project
        shell: bash
        run: |
          PROJECT="$(find "$GITHUB_WORKSPACE" \
            -type d \
            -name "ThreeOneOSFive.xcodeproj" \
            | head -n 1)"

          if [ -z "$PROJECT" ]; then
            echo "❌ ThreeOneOSFive.xcodeproj not found"
            exit 1
          fi

          echo "✅ Project: $PROJECT"
          echo "path=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Show Xcode targets
        shell: bash
        run: |
          xcodebuild \
            -project "${{ steps.project.outputs.path }}" \
            -list

      - name: Clean old build
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/build"
          rm -rf "$GITHUB_WORKSPACE/ipa"
          rm -f "$GITHUB_WORKSPACE/"*.ipa

      - name: Build HTVINTEX
        shell: bash
        run: |
          set -o pipefail

          xcodebuild \
            -project "${{ steps.project.outputs.path }}" \
            -target "3105" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="1.1.5" \
            CURRENT_PROJECT_VERSION="8" \
            clean build

      - name: Find built application
        id: app
        shell: bash
        run: |
          echo "Searching for .app..."

          APP="$(find "$GITHUB_WORKSPACE/build" \
            -type d \
            -name "*.app" \
            | head -n 1)"

          if [ -z "$APP" ]; then
            echo "❌ .app not found"

            echo "===== BUILD CONTENTS ====="
            find "$GITHUB_WORKSPACE/build" \
              -maxdepth 6 \
              -type d \
              | head -200 || true

            exit 1
          fi

          echo "✅ Found app:"
          echo "$APP"

          echo "path=$APP" >> "$GITHUB_OUTPUT"

      - name: Create Payload
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/ipa/Payload"

          cp -R \
            "${{ steps.app.outputs.path }}" \
            "$GITHUB_WORKSPACE/ipa/Payload/"

          echo "===== PAYLOAD ====="
          ls -la "$GITHUB_WORKSPACE/ipa/Payload"

      - name: Verify version
        shell: bash
        run: |
          PLIST="$(find "$GITHUB_WORKSPACE/ipa/Payload" \
            -path "*.app/Info.plist" \
            | head -n 1)"

          if [ -z "$PLIST" ]; then
            echo "❌ Info.plist not found"
            exit 1
          fi

          echo "===== HTVINTEX BUILD INFO ====="

          echo -n "Display Name: "
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleDisplayName" \
            "$PLIST" || true

          echo -n "Version: "
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleShortVersionString" \
            "$PLIST"

          echo -n "Build: "
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleVersion" \
            "$PLIST"

          echo -n "Bundle ID: "
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$PLIST" || true

      - name: Create unsigned IPA
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/ipa"

          IPA="$GITHUB_WORKSPACE/HTVINTEX-1.1.5-B8-${{ github.run_number }}-Unsigned.ipa"

          zip -qry "$IPA" Payload

          echo "✅ IPA created:"
          ls -lh "$IPA"

      - name: Upload HTVINTEX IPA
        uses: actions/upload-artifact@v4
        with:
          name: HTVINTEX-1.1.5-B8-${{ github.run_number }}
          path: HTVINTEX-1.1.5-B8-${{ github.run_number }}-Unsigned.ipa
          if-no-files-found: error
          retention-days: 30
