name: Build PUBG CONTROL IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source
        run: |
          unzip -q PUBG_CONTROL_COMPLETE_SOURCE.zip -d pubg-source
          echo "SOURCE_DIR=$(find pubg-source -name '*.xcodeproj' -print -quit | xargs dirname)" >> "$GITHUB_ENV"

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Detect project and scheme
        run: |
          PROJECT=$(find pubg-source -name "*.xcodeproj" -print -quit)
          if [ -z "$PROJECT" ]; then
            echo "ไม่พบไฟล์ Xcode project"
            exit 1
          fi

          SCHEME=$(xcodebuild -project "$PROJECT" -list -json |
            python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["project"]["schemes"][0])')

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"

      - name: Build application
        run: |
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Find application
        run: |
          APP=$(find "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos" \
            -maxdepth 1 -name "*.app" -print -quit)

          if [ -z "$APP" ]; then
            echo "ไม่พบไฟล์ .app หลังจาก Build"
            exit 1
          fi

          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: Prepare and sign for GBox
        run: |
          xattr -cr "$APP"

          find "$APP" \
            \( -name "*.framework" -o -name "*.dylib" -o -name "*.appex" \) \
            -print0 |
          while IFS= read -r -d '' ITEM; do
            /usr/bin/codesign \
              --force \
              --sign - \
              --timestamp=none \
              "$ITEM"
          done

          /usr/bin/codesign \
            --force \
            --deep \
            --sign - \
            --timestamp=none \
            "$APP"

          /usr/bin/codesign \
            --verify \
            --deep \
            --strict \
            --verbose=2 \
            "$APP"

      - name: Create IPA
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"

          cd "$RUNNER_TEMP"
          zip -qry "$GITHUB_WORKSPACE/PUBG-CONTROL-GBOX.ipa" Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PUBG-CONTROL-GBOX-BUILD9
          path: PUBG-CONTROL-GBOX.ipa
          if-no-files-found: error
          retention-days: 30
