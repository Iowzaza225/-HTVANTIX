name: Build PUBG CONTROL IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "PUBG_CONTROL_COMPLETE_SOURCE.zip"
      - ".github/workflows/build-pubg-from-zip.yml"

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source ZIP
        run: |
          ZIP="PUBG_CONTROL_COMPLETE_SOURCE.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: ไม่พบไฟล์ $ZIP"
            exit 1
          fi

          mkdir -p extracted
          ditto -x -k "$ZIP" extracted

          PROJECT="$(find extracted -type d -name "*.xcodeproj" | head -1)"

          if [ -z "$PROJECT" ]; then
            echo "ERROR: ไม่พบไฟล์ .xcodeproj ภายใน ZIP"
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Find Xcode scheme
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

          SCHEME="$(xcodebuild \
            -project "$PROJECT" \
            -list 2>/dev/null |
            awk '/Schemes:/{flag=1;next} flag && NF {
              gsub(/^[ \t]+|[ \t]+$/, "");
              print;
              exit
            }')"

          if [ -z "$SCHEME" ]; then
            echo "ERROR: ไม่พบ Scheme"
            xcodebuild -project "$PROJECT" -list
            exit 1
          fi

          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"
          echo "Project: $PROJECT"
          echo "Scheme: $SCHEME"

      - name: Build unsigned application
        run: |
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Create unsigned IPA
        run: |
          APP="$(find build -type d -name "*.app" | head -1)"

          if [ -z "$APP" ]; then
            echo "ERROR: ไม่พบไฟล์ .app"
            exit 1
          fi

          mkdir -p Payload
          cp -R "$APP" Payload/

          /usr/bin/zip -qry \
            PUBG-CONTROL-unsigned.ipa \
            Payload

          ls -lh PUBG-CONTROL-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PUBG-CONTROL-IPA
          path: PUBG-CONTROL-unsigned.ipa
          if-no-files-found: error
