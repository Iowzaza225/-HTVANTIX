name: Build HTVINTEX IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "**/*.swift"
      - "**/*.plist"
      - "**/*.entitlements"
      - "**/*.xcodeproj/**"
      - ".github/workflows/build-htvintex.yml"

jobs:
  build:
    name: Build HTVINTEX 1.1.5
    runs-on: macos-latest

    steps:
      # ─────────────────────────────
      # 1. โหลด Source จาก GitHub
      # ─────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ─────────────────────────────
      # 2. แสดง Xcode ที่ใช้งาน
      # ─────────────────────────────
      - name: Show Xcode version
        run: |
          xcodebuild -version
          swift --version

      # ─────────────────────────────
      # 3. หาไฟล์ Xcode Project
      # ─────────────────────────────
      - name: Locate Xcode project
        id: project
        shell: bash
        run: |
          PROJECT=$(find . -name "ThreeOneOSFive.xcodeproj" -type d | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "❌ ThreeOneOSFive.xcodeproj not found"
            exit 1
          fi

          echo "Found project: $PROJECT"
          echo "path=$PROJECT" >> "$GITHUB_OUTPUT"

      # ─────────────────────────────
      # 4. ดู Scheme
      # ─────────────────────────────
      - name: Show project schemes
        run: |
          xcodebuild \
            -project "${{ steps.project.outputs.path }}" \
            -list

      # ─────────────────────────────
      # 5. Build Release แบบไม่เซ็น
      # ─────────────────────────────
      - name: Build HTVINTEX
        shell: bash
        run: |
          set -o pipefail

          rm -rf build

          xcodebuild \
            -project "${{ steps.project.outputs.path }}" \
            -scheme "ThreeOneOSFive" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="1.1.5" \
            CURRENT_PROJECT_VERSION="8" \
            clean build

      # ─────────────────────────────
      # 6. หาไฟล์ .app
      # ─────────────────────────────
      - name: Locate built app
        id: app
        shell: bash
        run: |
          APP=$(find "$GITHUB_WORKSPACE/build/Build/Products" \
            -type d \
            -name "*.app" \
            | head -n 1)

          if [ -z "$APP" ]; then
            echo "❌ Built .app not found"
            exit 1
          fi

          echo "Found app:"
          echo "$APP"

          echo "path=$APP" >> "$GITHUB_OUTPUT"

      # ─────────────────────────────
      # 7. สร้าง Payload
      # ─────────────────────────────
      - name: Create IPA Payload
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/ipa"
          mkdir -p "$GITHUB_WORKSPACE/ipa/Payload"

          cp -R \
            "${{ steps.app.outputs.path }}" \
            "$GITHUB_WORKSPACE/ipa/Payload/"

      # ─────────────────────────────
      # 8. Package เป็น IPA
      # ─────────────────────────────
      - name: Package unsigned IPA
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/ipa"

          zip -qry \
            "$GITHUB_WORKSPACE/HTVINTEX-1.1.5-Build8-Unsigned.ipa" \
            Payload

          echo "✅ IPA created"
          ls -lh "$GITHUB_WORKSPACE/HTVINTEX-1.1.5-Build8-Unsigned.ipa"

      # ─────────────────────────────
      # 9. แสดงข้อมูล Version
      # ─────────────────────────────
      - name: Verify IPA version
        shell: bash
        run: |
          APP_PLIST=$(find "$GITHUB_WORKSPACE/ipa/Payload" \
            -path "*.app/Info.plist" \
            | head -n 1)

          echo "App Info:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleDisplayName" \
            "$APP_PLIST" || true

          echo -n "Version: "
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleShortVersionString" \
            "$APP_PLIST"

          echo -n "Build: "
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleVersion" \
            "$APP_PLIST"

      # ─────────────────────────────
      # 10. Upload IPA ให้โหลดใน Actions
      # ─────────────────────────────
      - name: Upload HTVINTEX IPA
        uses: actions/upload-artifact@v4
        with:
          name: HTVINTEX-1.1.5-Build8-Unsigned
          path: HTVINTEX-1.1.5-Build8-Unsigned.ipa
          if-no-files-found: error
          retention-days: 30
