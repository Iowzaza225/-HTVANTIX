# VIPERX 1.1.6 Build 9 — build exact uploaded source
name: VIPERX 1.1.6 Build 9

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build:
    name: Build VIPERX 1.1.6 Build 9
    runs-on: macos-latest

    steps:
      # =========================================================
      # 1. Checkout
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # 2. Environment
      # =========================================================
      - name: Show environment
        shell: bash
        run: |
          echo "======================================"
          echo "XCODE"
          echo "======================================"
          xcodebuild -version

          echo ""
          echo "======================================"
          echo "SWIFT"
          echo "======================================"
          swift --version

          echo ""
          echo "======================================"
          echo "REPOSITORY FILES"
          echo "======================================"
          find "$GITHUB_WORKSPACE" -maxdepth 3 -print | head -300

      # =========================================================
      # 3. Prepare source
      #    - ถ้ามี .xcodeproj อยู่แล้ว ใช้เลย
      #    - ถ้าไม่มี ให้หา ZIP และแตกก่อน
      # =========================================================
      - name: Prepare source
        id: source
        shell: bash
        run: |
          set -e

          echo "🔍 Searching for existing Xcode project..."

          PROJECT="$(find "$GITHUB_WORKSPACE" \
            -type d \
            -name "*.xcodeproj" \
            -not -path "*/.git/*" \
            | head -n 1)"

          if [ -n "$PROJECT" ]; then
            echo "✅ Project already extracted:"
            echo "$PROJECT"

            echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo ""
          echo "⚠️ No .xcodeproj found."
          echo "🔍 Searching for source ZIP..."

          ZIP="$(find "$GITHUB_WORKSPACE" \
            -type f \
            -iname "*.zip" \
            -not -path "*/.git/*" \
            | head -n 1)"

          if [ -z "$ZIP" ]; then
            echo "❌ No Xcode project and no ZIP file found."
            echo ""
            echo "Repository contents:"
            find "$GITHUB_WORKSPACE" -maxdepth 4 -print | head -400
            exit 1
          fi

          echo "✅ ZIP found:"
          echo "$ZIP"

          EXTRACT_DIR="$GITHUB_WORKSPACE/HTVINTEX_SOURCE"

          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"

          echo ""
          echo "📦 Extracting source..."

          /usr/bin/ditto \
            -x \
            -k \
            "$ZIP" \
            "$EXTRACT_DIR"

          echo ""
          echo "✅ ZIP extracted"

          echo ""
          echo "🔍 Searching for Xcode project after extraction..."

          PROJECT="$(find "$EXTRACT_DIR" \
            -type d \
            -name "*.xcodeproj" \
            | head -n 1)"

          if [ -z "$PROJECT" ]; then
            echo "❌ .xcodeproj still not found after extracting ZIP."
            echo ""
            echo "Extracted contents:"
            find "$EXTRACT_DIR" -maxdepth 5 -print | head -500
            exit 1
          fi

          echo ""
          echo "✅ XCODE PROJECT FOUND:"
          echo "$PROJECT"

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Inspect original restore implementation
        shell: bash
        run: |
          PROJECT="${{ steps.source.outputs.project }}"
          PROJECT_DIR="$(dirname "$PROJECT")"
          echo "===== ORIGINAL RESTORE SYMBOLS ====="
          grep -R -n -E "func restore|static func restore|restoreTargetsChanged|latestReceipt|inspectRestore" "$PROJECT_DIR/ThreeOneOSFive" | head -200 || true
          echo "===== ORIGINAL PatchTransaction restore ====="
          FILE="$PROJECT_DIR/ThreeOneOSFive/helpers/PatchTransaction.swift"
          if [ -f "$FILE" ]; then
            grep -n -A140 -B20 "static func restore" "$FILE" || grep -n -A140 -B20 "func restore" "$FILE" || true
          fi
          echo "===== ORIGINAL DevicePatchService ====="
          cat "$PROJECT_DIR/ThreeOneOSFive/helpers/DevicePatchService.swift" || true
          echo "===== ORIGINAL REMOTE ROW ====="
          sed -n '450,590p' "$PROJECT_DIR/ThreeOneOSFive/views/PatchProjectsView.swift" || true
          echo "===== ORIGINAL DETAIL DECLARATION ====="
          grep -n -A40 -B10 "private struct PatchProjectDetailView" "$PROJECT_DIR/ThreeOneOSFive/views/PatchProjectsView.swift" || true
          echo "===== ORIGINAL DETAIL RESTORE ====="
          sed -n '1590,1685p' "$PROJECT_DIR/ThreeOneOSFive/views/PatchProjectsView.swift" || true

      # =========================================================
      # 4. Patch HTVINTEX source for production behavior
      # =========================================================
      - name: Prepare VIPERX source
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.source.outputs.project }}"
          PROJECT_DIR="$(dirname "$PROJECT")"

          # Keep the uploaded source unchanged except for the known missing
          # semicolon in DisplayIdentity.m that prevents compilation.
          DISPLAY_ID="$PROJECT_DIR/ThreeOneOSFive/helpers/DisplayIdentity.m"
          if [ -f "$DISPLAY_ID" ]; then
            perl -0pi -e 's/(0x1e\n)\}/$1};/' "$DISPLAY_ID"
            echo "✅ DisplayIdentity syntax hotfix applied"
          fi

          echo "ℹ️ Runtime row fix disabled until source-safe patch is available"
          echo "✅ Source left intact; avoiding failed text-replacement patch"
          echo "✅ Building VIPERX source"
      # =========================================================
      # 5. Detect target
      # =========================================================
      - name: Detect Xcode target
        id: target
        shell: bash
        run: |
          PROJECT="${{ steps.source.outputs.project }}"

          echo "======================================"
          echo "XCODE PROJECT INFO"
          echo "======================================"

          xcodebuild \
            -project "$PROJECT" \
            -list

          echo ""
          echo "🔍 Detecting target..."

          PROJECT_INFO="$(xcodebuild \
            -project "$PROJECT" \
            -list)"

          # ใช้ Target 3105 ก่อน ถ้ามี
          if echo "$PROJECT_INFO" | grep -Eq '^[[:space:]]+3105[[:space:]]*$'; then
            TARGET="3105"
          else
            # ถ้าไม่มี 3105 เลือก Target แรกอัตโนมัติ
            TARGET="$(echo "$PROJECT_INFO" | awk '
              /Targets:/ {
                found=1
                next
              }

              /Build Configurations:/ {
                found=0
              }

              found && NF {
                gsub(/^[ \t]+|[ \t]+$/, "")
                print
                exit
              }
            ')"
          fi

          if [ -z "$TARGET" ]; then
            echo "❌ Could not detect an Xcode target."
            exit 1
          fi

          echo ""
          echo "✅ TARGET:"
          echo "$TARGET"

          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

      # =========================================================
      # 5. Prepare build
      # =========================================================
      - name: Prepare build folders
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/build"
          rm -rf "$GITHUB_WORKSPACE/ipa"

          mkdir -p "$GITHUB_WORKSPACE/ipa"

      # =========================================================
      # 6. Build
      # =========================================================
      - name: Build VIPERX
        shell: bash
        run: |
          set -o pipefail

          PROJECT="${{ steps.source.outputs.project }}"
          TARGET="${{ steps.target.outputs.target }}"

          echo "======================================"
          echo "VIPERX BUILD"
          echo "======================================"
          echo "Project: $PROJECT"
          echo "Target : $TARGET"
          echo "Version: 1.1.6"
          echo "Build  : 9"
          echo "======================================"

          xcodebuild \
            -project "$PROJECT" \
            -target "$TARGET" \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="1.1.6" \
            CURRENT_PROJECT_VERSION="9" \
            CONFIGURATION_BUILD_DIR="$GITHUB_WORKSPACE/build/products" \
            OBJROOT="$GITHUB_WORKSPACE/build/obj" \
            SYMROOT="$GITHUB_WORKSPACE/build" \
            build \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      # =========================================================
      # 7. Find .app
      # =========================================================
      - name: Find built app
        id: app
        shell: bash
        run: |
          echo "🔍 Searching for .app..."

          APP="$(find "$GITHUB_WORKSPACE/build" \
            -type d \
            -name "*.app" \
            | head -n 1)"

          if [ -z "$APP" ]; then
            echo "❌ Built .app not found."
            echo ""
            echo "Build contents:"
            find "$GITHUB_WORKSPACE/build" \
              -maxdepth 6 \
              -print \
              | head -400
            exit 1
          fi

          echo ""
          echo "✅ APP FOUND:"
          echo "$APP"

          echo "app=$APP" >> "$GITHUB_OUTPUT"

      # =========================================================
      # 8. Set final app display name
      # =========================================================
      - name: Set app name to VIPERX
        shell: bash
        run: |
          set -e

          APP="${{ steps.app.outputs.app }}"
          PLIST="$APP/Info.plist"

          if [ ! -f "$PLIST" ]; then
            echo "❌ Info.plist not found."
            exit 1
          fi

          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName VIPERX" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string VIPERX" "$PLIST"

          /usr/libexec/PlistBuddy -c "Set :CFBundleName VIPERX" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleName string VIPERX" "$PLIST"

          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.1.6" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string 1.1.6" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 9" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string 9" "$PLIST"
          echo "✅ App display name set to VIPERX"

      # =========================================================
      # 9. Verify version
      # =========================================================
      - name: Verify app information
        shell: bash
        run: |
          APP="${{ steps.app.outputs.app }}"
          PLIST="$APP/Info.plist"

          if [ ! -f "$PLIST" ]; then
            echo "❌ Info.plist not found."
            exit 1
          fi

          echo "======================================"
          echo "VIPERX APP INFO"
          echo "======================================"

          echo -n "Name: "
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleDisplayName" \
            "$PLIST" || true

          echo -n "Version: "
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleShortVersionString" \
            "$PLIST" || true

          echo -n "Build: "
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleVersion" \
            "$PLIST" || true

          echo -n "Bundle ID: "
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$PLIST" || true

      # =========================================================
      # 9. Create Payload
      # =========================================================
      - name: Create IPA Payload
        shell: bash
        run: |
          APP="${{ steps.app.outputs.app }}"

          rm -rf "$GITHUB_WORKSPACE/ipa"

          mkdir -p \
            "$GITHUB_WORKSPACE/ipa/Payload"

          cp -R \
            "$APP" \
            "$GITHUB_WORKSPACE/ipa/Payload/"

          echo "✅ Payload created"

      # =========================================================
      # 10. Create IPA
      # =========================================================
      - name: Create unsigned IPA
        id: ipa
        shell: bash
        run: |
          IPA_NAME="VIPERX-1.1.6-Build9-${GITHUB_RUN_NUMBER}-Unsigned.ipa"

          IPA_PATH="$GITHUB_WORKSPACE/$IPA_NAME"

          cd "$GITHUB_WORKSPACE/ipa"

          /usr/bin/zip \
            -qry \
            "$IPA_PATH" \
            Payload

          if [ ! -f "$IPA_PATH" ]; then
            echo "❌ IPA creation failed."
            exit 1
          fi

          echo ""
          echo "✅ IPA CREATED:"
          ls -lh "$IPA_PATH"

          echo "name=$IPA_NAME" >> "$GITHUB_OUTPUT"
          echo "path=$IPA_PATH" >> "$GITHUB_OUTPUT"

      # =========================================================
      # 11. Verify IPA
      # =========================================================
      - name: Verify IPA
        shell: bash
        run: |
          unzip -l \
            "${{ steps.ipa.outputs.path }}" \
            | head -100

          echo ""
          echo "✅ IPA verified"

      # =========================================================
      # 12. Upload IPA
      # =========================================================
      - name: Upload VIPERX IPA
        uses: actions/upload-artifact@v4
        with:
          name: VIPERX-1.1.6-Build9-${{ github.run_number }}
          path: ${{ steps.ipa.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      # =========================================================
      # 13. Upload error log
      # =========================================================
      - name: Upload build log if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: VIPERX-Build-Log-${{ github.run_number }}
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
