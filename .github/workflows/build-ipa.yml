name: Build HTVANTIX IPA

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "*.zip"
      - ".github/workflows/**"

jobs:
  build:
    runs-on: macos-latest

    env:
      HTVANTIX_APP_TOKEN: ${{ secrets.HTVANTIX_APP_TOKEN }}
      BUNDLE_ID: com.apple.mobile.MobileHouseArrest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 20

      # ==============================
      # CHECK TOKEN
      # ==============================

      - name: Check App Token
        run: |
          set -e

          if [ -z "$HTVANTIX_APP_TOKEN" ]; then
            echo "ERROR: HTVANTIX_APP_TOKEN is EMPTY"
            exit 1
          fi

          echo "TOKEN CONFIGURED"
          echo "TOKEN LENGTH: ${#HTVANTIX_APP_TOKEN}"

      # ==============================
      # FIND NEWEST ZIP
      # ==============================

      - name: Find Latest ZIP
        run: |
          set -e

          ZIP_REL=$(git diff-tree \
            --no-commit-id \
            --name-only \
            -r "$GITHUB_SHA" \
            | grep -E '\.zip$' \
            | head -n 1 || true)

          if [ -z "$ZIP_REL" ]; then

            ZIP_REL=$(git log \
              --name-only \
              --pretty=format: \
              -- "*.zip" \
              | grep -E '\.zip$' \
              | head -n 1 || true)

          fi

          if [ -z "$ZIP_REL" ]; then
            echo "ERROR: ZIP NOT FOUND"
            exit 1
          fi

          ZIP_FILE="$GITHUB_WORKSPACE/$ZIP_REL"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP FILE DOES NOT EXIST"
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

          echo "=============================="
          echo "BUILD SOURCE:"
          echo "$ZIP_REL"
          echo "=============================="

      # ==============================
      # EXTRACT
      # ==============================

      - name: Extract Source
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/source"
          mkdir -p "$GITHUB_WORKSPACE/source"

          unzip -q "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/source"

      # ==============================
      # FIND PROJECT
      # ==============================

      - name: Find Xcode Project
        run: |
          set -e

          PROJECT=$(find "$GITHUB_WORKSPACE/source" \
            -type d \
            -name "*.xcodeproj" \
            | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: XCODE PROJECT NOT FOUND"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")
          PROJECT_NAME=$(basename "$PROJECT")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "PROJECT_NAME=$PROJECT_NAME" >> "$GITHUB_ENV"

          echo "PROJECT: $PROJECT"

      # ==============================
      # DETECT SCHEME
      # ==============================

      - name: Detect Scheme
        run: |
          set -e

          cd "$PROJECT_DIR"

          SCHEME=$(xcodebuild \
            -project "$PROJECT_NAME" \
            -list \
            | awk '
              /Schemes:/ {found=1; next}
              found && NF {
                gsub(/^[ \t]+|[ \t]+$/, "")
                print
                exit
              }
            ')

          if [ -z "$SCHEME" ]; then
            echo "ERROR: SCHEME NOT FOUND"
            exit 1
          fi

          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"

          echo "SCHEME: $SCHEME"

      # ==============================
      # BUILD
      # ==============================

      - name: Build Release
        run: |
          set -o pipefail

          cd "$PROJECT_DIR"

          xcodebuild \
            -project "$PROJECT_NAME" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            HTVANTIX_APP_TOKEN="$HTVANTIX_APP_TOKEN" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build \
            | tee "$GITHUB_WORKSPACE/xcodebuild.log"

      # ==============================
      # FIND APP
      # ==============================

      - name: Find Built APP
        run: |
          set -e

          APP_PATH=$(find "$GITHUB_WORKSPACE/build" \
            -type d \
            -name "*.app" \
            -path "*Release-iphoneos*" \
            | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: APP NOT FOUND"
            exit 1
          fi

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

          echo "APP: $APP_PATH"

      # ==============================
      # INJECT CONFIG
      # ==============================

      - name: Inject Client Configuration
        run: |
          set -e

          PLIST="$APP_PATH/Info.plist"

          if [ ! -f "$PLIST" ]; then
            echo "ERROR: Info.plist NOT FOUND"
            exit 1
          fi

          # Bundle ID

          /usr/libexec/PlistBuddy \
            -c "Delete :CFBundleIdentifier" \
            "$PLIST" 2>/dev/null || true

          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleIdentifier string $BUNDLE_ID" \
            "$PLIST"

          # HTVANTIX App Token

          /usr/libexec/PlistBuddy \
            -c "Delete :HTVANTIX_APP_TOKEN" \
            "$PLIST" 2>/dev/null || true

          /usr/libexec/PlistBuddy \
            -c "Add :HTVANTIX_APP_TOKEN string $HTVANTIX_APP_TOKEN" \
            "$PLIST"

          echo "=============================="
          echo "CLIENT CONFIG INJECTED"
          echo "=============================="

          echo "Bundle:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$PLIST"

          TOKEN_CHECK=$(/usr/libexec/PlistBuddy \
            -c "Print :HTVANTIX_APP_TOKEN" \
            "$PLIST")

          if [ -z "$TOKEN_CHECK" ]; then
            echo "ERROR: TOKEN NOT IN Info.plist"
            exit 1
          fi

          echo "TOKEN PRESENT"
          echo "TOKEN LENGTH: ${#TOKEN_CHECK}"

      # ==============================
      # REMOVE OLD SIGNATURE
      # ==============================

      - name: Remove Old Signing
        run: |
          set -e

          rm -rf "$APP_PATH/_CodeSignature"
          rm -f "$APP_PATH/embedded.mobileprovision"

      # ==============================
      # CREATE IPA
      # ==============================

      - name: Create IPA
        run: |
          set -e

          IPA_NAME="HTVANTIX_CONFIG_${GITHUB_RUN_NUMBER}.ipa"

          rm -rf "$GITHUB_WORKSPACE/Payload"
          mkdir -p "$GITHUB_WORKSPACE/Payload"

          cp -R "$APP_PATH" \
            "$GITHUB_WORKSPACE/Payload/"

          cd "$GITHUB_WORKSPACE"

          zip -qry \
            "$IPA_NAME" \
            Payload

          echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"

          echo "=============================="
          echo "IPA CREATED:"
          echo "$IPA_NAME"
          echo "=============================="

          ls -lh "$IPA_NAME"

      # ==============================
      # UPLOAD IPA
      # ==============================

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HTVANTIX-CONFIG-${{ github.run_number }}
          path: ${{ env.IPA_NAME }}
          if-no-files-found: error
          retention-days: 30

      # ==============================
      # BUILD LOG
      # ==============================

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HTVANTIX-BUILD-LOG-${{ github.run_number }}
          path: xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
