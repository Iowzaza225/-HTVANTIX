name: Build 3105 IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect repository
        run: |
          echo "=== BEFORE EXTRACT ==="
          pwd
          ls -la
          find . -maxdepth 2 -type f | sort | head -200

      - name: Extract 3105 source ZIP
        run: |
          ZIP_FILE="$(find . -maxdepth 2 -type f \
            \( -name "3105_GITHUB_READY_TOGGLE_UI.zip" \
            -o -name "3105_PHASE1_FILE_SYSTEM_TOGGLE_UI.zip" \
            -o -name "3105_HOME_PATCH_PRIVACY_SEPARATE_SRC*.zip" \
            -o -name "*.zip" \) | head -1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ไม่พบไฟล์ ZIP ของโปรเจกต์ใน repository"
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          rm -rf extracted_3105
          mkdir -p extracted_3105

          unzip -q "$ZIP_FILE" -d extracted_3105

          echo "=== AFTER EXTRACT ==="
          find extracted_3105 -type d -name "*.xcodeproj" -print

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Detect project
        run: |
          PROJECT="$(find extracted_3105 -type d -name "*.xcodeproj" | head -1)"

          if [ -z "$PROJECT" ]; then
            echo "ERROR: แตก ZIP แล้วแต่ไม่พบ .xcodeproj"
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT"

          xcodebuild -project "$PROJECT" -list

      - name: Detect scheme
        run: |
          SCHEME="$(xcodebuild -project "$PROJECT" -list 2>/dev/null \
            | awk '/Schemes:/{flag=1;next} flag && NF {gsub(/^[ \t]+|[ \t]+$/, ""); print; exit}')"

          if [ -z "$SCHEME" ]; then
            echo "ERROR: ไม่พบ Scheme"
            exit 1
          fi

          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"
          echo "Using scheme: $SCHEME"

      - name: Build App
        run: |
          echo "Project: $PROJECT"
          echo "Scheme: $SCHEME"

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Find App
        run: |
          echo "=== APP OUTPUT ==="
          find build -type d -name "*.app" -print

      - name: Create IPA
        run: |
          APP="$(find build -type d -name "*.app" | head -1)"

          if [ -z "$APP" ]; then
            echo "ERROR: Build ผ่านแต่ไม่พบ .app"
            exit 1
          fi

          echo "Found app: $APP"

          rm -rf Payload
          mkdir -p Payload

          cp -R "$APP" Payload/

          /usr/bin/zip -qry 3105-unsigned.ipa Payload

          echo "=== IPA CREATED ==="
          ls -lh 3105-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 3105-IPA
          path: 3105-unsigned.ipa
          if-no-files-found: error
