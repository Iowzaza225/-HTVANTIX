name: Build HTV811 IPA

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "*.zip"
      - ".github/workflows/**"

jobs:
  build:
    runs-on: macos-latest

    env:
      HTVANTIX_APP_TOKEN: ${{ secrets.HTVANTIX_APP_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode version
        run: |
          xcodebuild -version
          swift --version

      - name: Extract source
        run: |
          set -e

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -maxdepth 2 \
            -type f \
            -name "*.zip" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found"
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          rm -rf "$GITHUB_WORKSPACE/extracted"
          mkdir -p "$GITHUB_WORKSPACE/extracted"

          unzip -q "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/extracted"

      - name: Find Xcode project
        run: |
          set -e

          PROJECT=$(find "$GITHUB_WORKSPACE/extracted" \
            -type d \
            -name "*.xcodeproj" \
            | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Xcode project not found"
            find "$GITHUB_WORKSPACE/extracted" -maxdepth 6 -print
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")
          PROJECT_NAME=$(basename "$PROJECT")

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "PROJECT_NAME=$PROJECT_NAME" >> "$GITHUB_ENV"

          echo "Found project: $PROJECT"

      - name: Detect scheme
        run: |
          set -e

          cd "$PROJECT_DIR"

          xcodebuild \
            -project "$PROJECT_NAME" \
            -list

          SCHEME=$(xcodebuild \
            -project "$PROJECT_NAME" \
            -list \
            | awk '
              /Schemes:/ {found=1; next}
              found && NF {
                gsub(/^[ \t]+|[ \t]+$/, "")
                print
                exit
              }
            ')

          if [ -z "$SCHEME" ]; then
            echo "ERROR: Scheme not found"
            exit 1
          fi

          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"
          echo "Using scheme: $SCHEME"

      - name: Inject app token
        run: |
          set -e

          if [ -z "$HTVANTIX_APP_TOKEN" ]; then
            echo "ERROR: HTVANTIX_APP_TOKEN secret is empty"
            exit 1
          fi

          PLIST=$(find "$PROJECT_DIR" \
            -type f \
            -name "Info.plist" \
            | head -n 1)

          if [ -n "$PLIST" ]; then
            echo "Using Info.plist: $PLIST"

            /usr/libexec/PlistBuddy \
              -c "Delete :HTVANTIXAppToken" \
              "$PLIST" 2>/dev/null || true

            /usr/libexec/PlistBuddy \
              -c "Add :HTVANTIXAppToken string $HTVANTIX_APP_TOKEN" \
              "$PLIST"
          fi

      - name: Build
        run: |
          set -o pipefail

          cd "$PROJECT_DIR"

          xcodebuild \
            -project "$PROJECT_NAME" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            HTVANTIX_APP_TOKEN="$HTVANTIX_APP_TOKEN" \
            clean build \
            | tee "$GITHUB_WORKSPACE/xcodebuild.log"

      - name: Find app
        run: |
          set -e

          APP_PATH=$(find "$GITHUB_WORKSPACE/build" \
            -type d \
            -name "*.app" \
            -path "*Release-iphoneos*" \
            | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app not found"
            find "$GITHUB_WORKSPACE/build" -name "*.app" -print || true
            exit 1
          fi

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          echo "Found app: $APP_PATH"

      - name: Fix Info.plist executable
        run: |
          set -e

          PLIST="$APP_PATH/Info.plist"

          if [ ! -f "$PLIST" ]; then
            echo "ERROR: Info.plist not found"
            exit 1
          fi

          EXECUTABLE_NAME=$(/usr/libexec/PlistBuddy \
            -c "Print :CFBundleExecutable" \
            "$PLIST" 2>/dev/null || true)

          if [ -z "$EXECUTABLE_NAME" ]; then
            EXECUTABLE_NAME=$(basename "$APP_PATH" .app)

            /usr/libexec/PlistBuddy \
              -c "Add :CFBundleExecutable string $EXECUTABLE_NAME" \
              "$PLIST"
          fi

          echo "Executable: $EXECUTABLE_NAME"

      - name: Show app information
        run: |
          PLIST="$APP_PATH/Info.plist"

          echo "Bundle ID:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$PLIST" || true

          echo "Version:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleShortVersionString" \
            "$PLIST" || true

          echo "Build:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleVersion" \
            "$PLIST" || true

          echo "Executable:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleExecutable" \
            "$PLIST" || true

      - name: Remove old signing files
        run: |
          rm -rf "$APP_PATH/_CodeSignature"
          rm -f "$APP_PATH/embedded.mobileprovision"

      - name: Create IPA
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/ipa"
          mkdir -p "$GITHUB_WORKSPACE/ipa/Payload"

          cp -R "$APP_PATH" \
            "$GITHUB_WORKSPACE/ipa/Payload/"

          cd "$GITHUB_WORKSPACE/ipa"

          zip -qry \
            "$GITHUB_WORKSPACE/HTV811.ipa" \
            Payload

          echo "IPA created:"
          ls -lh "$GITHUB_WORKSPACE/HTV811.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HTV811-IPA
          path: HTV811.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HTV811-Build-Log
          path: xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
