name: Build HTVANTIX IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Bundle ZIP
        run: |
          echo "=== ZIP FILES ==="
          find . -maxdepth 1 -type f -name "*.zip" -print

          ZIP_FILE="$(find . -maxdepth 1 -type f -name "*.zip" | head -1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ไม่พบไฟล์ ZIP"
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract Bundle
        run: |
          rm -rf bundle
          mkdir -p bundle

          unzip -q "$ZIP_FILE" -d bundle

          echo "=== EXTRACTED ==="
          find bundle -maxdepth 3 -type d | sort | head -200

      - name: Find Client Project
        run: |
          PROJECT="$(find bundle -type d -name "*.xcodeproj" | head -1)"

          if [ -z "$PROJECT" ]; then
            echo "ERROR: ไม่พบ .xcodeproj"
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT"

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Detect Scheme
        run: |
          echo "=== PROJECT INFO ==="
          xcodebuild -project "$PROJECT" -list

          SCHEME="$(xcodebuild \
            -project "$PROJECT" \
            -list 2>/dev/null |
            awk '/Schemes:/{flag=1;next} flag && NF {
              gsub(/^[ \t]+|[ \t]+$/, "");
              print;
              exit
            }')"

          if [ -z "$SCHEME" ]; then
            echo "ERROR: ไม่พบ Scheme"
            exit 1
          fi

          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"
          echo "Using scheme: $SCHEME"

      - name: Build Client
        run: |
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Find App
        run: |
          echo "=== BUILT APP ==="
          find build -type d -name "*.app" -print

      - name: Create IPA
        run: |
          APP="$(find build -type d -name "*.app" | head -1)"

          if [ -z "$APP" ]; then
            echo "ERROR: ไม่พบ .app"
            exit 1
          fi

          echo "Using app: $APP"

          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/

          /usr/bin/zip -qry HTVANTIX-unsigned.ipa Payload

          echo "=== IPA CREATED ==="
          ls -lh HTVANTIX-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HTVANTIX-IPA
          path: HTVANTIX-unsigned.ipa
          if-no-files-found: error
