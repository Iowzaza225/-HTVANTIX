name: VIPERXMOD BUILD

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version

      - name: Prepare VIPERXMOD source
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="./VIPERXMOD_V1.0.0_BUILD1_FILE_ENGINE_SELF_HEAL_FIX_SOURCE.zip"
          test -f "$ZIP_FILE" || { echo "ERROR: ไม่พบ $ZIP_FILE"; ls -lah; exit 1; }

          rm -rf source
          mkdir -p source
          unzip -q "$ZIP_FILE" -d source

          PROJECT="$(find source -type d -name '*.xcodeproj' -print -quit)"
          test -n "$PROJECT" || { echo "ERROR: ไม่พบ .xcodeproj"; find source -maxdepth 5 -print; exit 1; }

          SCHEME="$(xcodebuild -project "$PROJECT" -list 2>/dev/null | awk '/Schemes:/{flag=1;next} flag && NF {gsub(/^[ \t]+|[ \t]+$/, ""); print; exit}')"
          test -n "$SCHEME" || { echo "ERROR: scheme not found"; xcodebuild -project "$PROJECT" -list; exit 1; }

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"
          echo "PROJECT=$PROJECT"
          echo "SCHEME=$SCHEME"

      - name: Verify Scheme
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project "$PROJECT" -list

      - name: Build VIPERXMOD
        shell: bash
        run: |
          set -o pipefail
          rm -rf "$GITHUB_WORKSPACE/build" "$GITHUB_WORKSPACE/Payload"
          rm -f "$GITHUB_WORKSPACE/VIPERXMOD_V1.0.0_BUILD1_unsigned.ipa" "$GITHUB_WORKSPACE/xcodebuild.log"

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build 2>&1 | tee "$GITHUB_WORKSPACE/xcodebuild.log"

      - name: Create IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find "$GITHUB_WORKSPACE/build" -type d -path '*Release-iphoneos/*.app' -print -quit)"
          test -n "$APP_PATH" || { echo "ERROR: ไม่พบ .app"; find "$GITHUB_WORKSPACE/build" -maxdepth 7 -print; exit 1; }

          cd "$GITHUB_WORKSPACE"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -qry VIPERXMOD_V1.0.0_BUILD1_unsigned.ipa Payload
          ls -lh VIPERXMOD_V1.0.0_BUILD1_unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VIPERXMOD-V1.0.0-BUILD1-IPA-${{ github.run_number }}
          path: VIPERXMOD_V1.0.0_BUILD1_unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Show Errors
        if: failure()
        shell: bash
        run: |
          if [ -f "$GITHUB_WORKSPACE/xcodebuild.log" ]; then
            grep -n -i -E 'error:|fatal error:|BUILD FAILED|SwiftCompile|CompileSwift|Ld ' "$GITHUB_WORKSPACE/xcodebuild.log" | tail -250 || true
          fi

      - name: Upload Build Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: VIPERXMOD-BUILD-LOG-${{ github.run_number }}
          path: xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
