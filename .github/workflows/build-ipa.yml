name: HTVANTIX BUILD

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        shell: bash
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version

      - name: Prepare Source
        shell: bash
        run: |
          set -e
          ZIP_FILE="./HTVANTIX_V1.1.2_BUILD8_CATALOG_VISIBILITY_LICENSE_FIX_SOURCE.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ไม่พบ $ZIP_FILE"
            ls -lah
            exit 1
          fi

          rm -rf source
          mkdir -p source
          unzip -q "$ZIP_FILE" -d source

          PROJECT="$(find source -type d -name '*.xcodeproj' -print -quit)"
          INFO_PLIST="$(find source -type f -path '*/ThreeOneOSFive/Info.plist' -print -quit)"
          APP_SWIFT="$(find source -type f -path '*/ThreeOneOSFive/App.swift' -print -quit)"

          if [ -z "$PROJECT" ] || [ -z "$INFO_PLIST" ] || [ -z "$APP_SWIFT" ]; then
            echo "ERROR: source ไม่ครบ"
            exit 1
          fi

          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.1.2" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 8" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Set :AppReleaseDisplayVersion 1.1.2" "$INFO_PLIST"

          python3 - "$APP_SWIFT" <<'PY'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          s = p.read_text()
          old = """    init() {\n        HTVAntiDebug.enforce()\n        setupLogCapture()"""
          new = """    init() {\n        if #available(iOS 19.0, *) {\n            HTVAntiDebug.enforce()\n        }\n        setupLogCapture()"""
          if old in s:
              s = s.replace(old, new, 1)

          anchor = """    private var language: AppLanguage {\n        AppLanguage(rawValue: languageCode) ?? .english\n    }\n"""
          insert = """    private var language: AppLanguage {\n        AppLanguage(rawValue: languageCode) ?? .english\n    }\n\n    private var shouldUseCaptureProtection: Bool {\n        if #available(iOS 19.0, *) { return true }\n        return false\n    }\n"""
          if "shouldUseCaptureProtection" not in s:
              if anchor not in s:
                  raise SystemExit("ERROR: language anchor not found")
              s = s.replace(anchor, insert, 1)

          if "if captureProtectionEnabled && shouldUseCaptureProtection {" not in s:
              old_capture = "        if captureProtectionEnabled {"
              if old_capture not in s:
                  raise SystemExit("ERROR: capture branch not found")
              s = s.replace(old_capture, "        if captureProtectionEnabled && shouldUseCaptureProtection {", 1)

          p.write_text(s)
          PY

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "SCHEME=3105" >> "$GITHUB_ENV"

      - name: Verify Scheme
        shell: bash
        run: |
          xcodebuild -project "$PROJECT" -list
          echo "Using scheme: $SCHEME"

      - name: Build HTVANTIX
        shell: bash
        run: |
          set -o pipefail
          rm -rf "$GITHUB_WORKSPACE/build" "$GITHUB_WORKSPACE/Payload"
          rm -f "$GITHUB_WORKSPACE/HTVANTIX.ipa" "$GITHUB_WORKSPACE/xcodebuild.log"

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            MARKETING_VERSION=1.1.2 \
            CURRENT_PROJECT_VERSION=8 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build \
            2>&1 | tee "$GITHUB_WORKSPACE/xcodebuild.log"

      - name: Verify Built App Version
        shell: bash
        run: |
          APP_PATH="$(find "$GITHUB_WORKSPACE/build" -type d -path '*Release-iphoneos/*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: ไม่พบ .app"
            exit 1
          fi
          BUILT_PLIST="$APP_PATH/Info.plist"
          echo "Version: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$BUILT_PLIST")"
          echo "Build: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$BUILT_PLIST")"
          echo "Display: $(/usr/libexec/PlistBuddy -c 'Print :AppReleaseDisplayVersion' "$BUILT_PLIST")"

      - name: Create IPA
        shell: bash
        run: |
          APP_PATH="$(find "$GITHUB_WORKSPACE/build" -type d -path '*Release-iphoneos/*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: ไม่พบ .app"
            exit 1
          fi

          cd "$GITHUB_WORKSPACE"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -qry HTVANTIX.ipa Payload
          ls -lh HTVANTIX.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HTVANTIX-V1.1.2-BUILD8-CATALOG-VISIBILITY-LICENSE-FIX-${{ github.run_number }}
          path: HTVANTIX.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Show Errors
        if: failure()
        shell: bash
        run: |
          if [ -f "$GITHUB_WORKSPACE/xcodebuild.log" ]; then
            grep -n -i -E 'error:|fatal error:|BUILD FAILED|SwiftCompile|CompileSwift' "$GITHUB_WORKSPACE/xcodebuild.log" | tail -200 || true
          fi

      - name: Upload Build Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: HTVANTIX-CATALOG-VISIBILITY-LICENSE-FIX-LOG-${{ github.run_number }}
          path: xcodebuild.log
          if-no-files-found: ignore
