name: Build 3105 IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show project files
        run: |
          pwd
          echo "=== ROOT ==="
          ls -la
          echo "=== FILES ==="
          find . -maxdepth 3 -type f | sort | head -300

      - name: Install Theos
        run: |
          brew install make ldid
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"

      - name: Build
        run: |
          export THEOS="$HOME/theos"
          export PATH="$THEOS/bin:$PATH"

          echo "=== MAKEFILE ==="
          find . -maxdepth 3 \( -name "Makefile" -o -name "makefile" \) -print

          make -j2

      - name: Find App
        run: |
          echo "=== APP OUTPUT ==="
          find . -type d -name "*.app" -print

      - name: Create IPA
        run: |
          APP="$(find . -type d -name "*.app" | head -1)"

          if [ -z "$APP" ]; then
            echo "ERROR: Build ผ่านแต่ไม่พบไฟล์ .app"
            exit 1
          fi

          echo "Using app: $APP"

          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/

          /usr/bin/zip -qry 3105-unsigned.ipa Payload

          echo "=== IPA ==="
          ls -lh 3105-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 3105-IPA
          path: 3105-unsigned.ipa
          if-no-files-found: error
