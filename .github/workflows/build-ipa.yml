name: Build HTVANTIX IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Source ZIP
        run: |
          echo "=== FIND ZIP ==="

          ZIP_FILE="$(find . -type f -name "*.zip" | head -1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ไม่พบ ZIP"
            exit 1
          fi

          echo "Using: $ZIP_FILE"

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "=== XCODE PROJECTS ==="
          find extracted -type d -name "*.xcodeproj" -print

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Detect Project
        run: |
          PROJECT="$(find extracted -type d -name "*.xcodeproj" | head -1)"

          if [ -z "$PROJECT" ]; then
            echo "ERROR: ไม่พบ .xcodeproj"
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "PROJECT = $PROJECT"

          xcodebuild -project "$PROJECT" -list

      - name: Detect Scheme
        run: |
          SCHEME="$(xcodebuild \
            -project "$PROJECT" \
            -list 2>/dev/null |
            awk '/Schemes:/{flag=1;next} flag && NF {
              gsub(/^[ \t]+|[ \t]+$/, "");
              print;
              exit
            }')"

          if [ -z "$SCHEME" ]; then
            echo "ERROR: ไม่พบ Scheme"
            exit 1
          fi

          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"
          echo "SCHEME = $SCHEME"

      - name: Build HTVANTIX
        run: |
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Find APP
        run: |
          echo "=== APP ==="
          find build -type d -name "*.app" -print

      - name: Create IPA
        run: |
          APP="$(find build -type d -name "*.app" | head -1)"

          if [ -z "$APP" ]; then
            echo "ERROR: Build เสร็จแต่ไม่พบ .app"
            exit 1
          fi

          echo "Found: $APP"

          rm -rf Payload
          mkdir -p Payload

          cp -R "$APP" Payload/

          /usr/bin/zip -qry \
            HTVANTIX-unsigned.ipa \
            Payload

          echo "=== IPA CREATED ==="
          ls -lh HTVANTIX-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HTVANTIX-IPA
          path: HTVANTIX-unsigned.ipa
          if-no-files-found: error
