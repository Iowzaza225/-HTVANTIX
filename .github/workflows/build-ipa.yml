name: HTVANTIX BUILD

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version

      - name: Prepare Source
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="./HTVANTIX_V1.1.2_BUILD8_MOTION_UI_SAFE_SOURCE.zip"
          test -f "$ZIP_FILE" || { echo "ERROR: ไม่พบ $ZIP_FILE"; ls -lah; exit 1; }

          rm -rf source
          mkdir -p source
          unzip -q "$ZIP_FILE" -d source

          PROJECT="$(find source -type d -name '*.xcodeproj' -print -quit)"
          INFO_PLIST="$(find source -type f -path '*/ThreeOneOSFive/Info.plist' -print -quit)"
          test -n "$PROJECT" && test -n "$INFO_PLIST" || { echo "ERROR: source ไม่ครบ"; find source -maxdepth 4 -print; exit 1; }

          ROOT="$(dirname "$PROJECT")"
          echo "ROOT=$ROOT"

          if compgen -G "$GITHUB_WORKSPACE/patches/*.patch" > /dev/null; then
            echo "===== APPLY HTVANTIX V2 PATCHES ====="
            for PATCH_FILE in "$GITHUB_WORKSPACE"/patches/*.patch; do
              echo "Applying $(basename "$PATCH_FILE")"
              patch --batch --forward -p1 -d "$ROOT" < "$PATCH_FILE"
            done
          fi

          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName HTVANTIX" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.1.2" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 8" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Set :AppReleaseDisplayVersion 1.1.2" "$INFO_PLIST" || true

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "SCHEME=3105" >> "$GITHUB_ENV"
          echo "INFO_PLIST=$INFO_PLIST" >> "$GITHUB_ENV"

          echo "PROJECT=$PROJECT"
          echo "INFO_PLIST=$INFO_PLIST"

      - name: Verify Scheme
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project "$PROJECT" -list

      - name: Build HTVANTIX
        shell: bash
        run: |
          set -o pipefail
          rm -rf "$GITHUB_WORKSPACE/build" "$GITHUB_WORKSPACE/Payload"
          rm -f "$GITHUB_WORKSPACE/HTVANTIX_V1.1.2_BUILD8_unsigned.ipa" "$GITHUB_WORKSPACE/xcodebuild.log"

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            MARKETING_VERSION=1.1.2 \
            CURRENT_PROJECT_VERSION=8 \
            PRODUCT_NAME=HTVANTIX \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build 2>&1 | tee "$GITHUB_WORKSPACE/xcodebuild.log"

      - name: Create IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find "$GITHUB_WORKSPACE/build" -type d -path '*Release-iphoneos/*.app' -print -quit)"
          test -n "$APP_PATH" || { echo "ERROR: ไม่พบ .app"; find "$GITHUB_WORKSPACE/build" -maxdepth 7 -print; exit 1; }

          cd "$GITHUB_WORKSPACE"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -qry HTVANTIX_V1.1.2_BUILD8_unsigned.ipa Payload
          ls -lh HTVANTIX_V1.1.2_BUILD8_unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HTVANTIX-V1.1.2-BUILD8-IPA-${{ github.run_number }}
          path: HTVANTIX_V1.1.2_BUILD8_unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Show Errors
        if: failure()
        shell: bash
        run: |
          if [ -f "$GITHUB_WORKSPACE/xcodebuild.log" ]; then
            grep -n -i -E 'error:|fatal error:|BUILD FAILED|SwiftCompile|CompileSwift|Ld ' "$GITHUB_WORKSPACE/xcodebuild.log" | tail -250 || true
          fi

      - name: Upload Build Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: HTVANTIX-BUILD-LOG-${{ github.run_number }}
          path: xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
