name: Build HTVANTIX IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Find Xcode project
        run: |
          find . -maxdepth 3 \( -name "*.xcodeproj" -o -name "*.xcworkspace" \) -print

      - name: Inject HTVANTIX App Token
        env:
          HTVANTIX_APP_TOKEN: ${{ secrets.HTVANTIX_APP_TOKEN }}
        run: |
          echo "HTVANTIX_APP_TOKEN is configured"
          echo "HTVANTIX_APP_TOKEN=$HTVANTIX_APP_TOKEN" >> $GITHUB_ENV

      - name: Build HTVANTIX
        run: |
          set -o pipefail

          xcodebuild \
            -project HTVANTIX.xcodeproj \
            -scheme HTVANTIX \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            HTVANTIX_APP_TOKEN="${HTVANTIX_APP_TOKEN}" \
            clean build

      - name: Find APP
        run: |
          find build -name "*.app" -print

      - name: Create IPA
        run: |
          APP_PATH=$(find build -name "*.app" -type d | head -1)

          if [ -z "$APP_PATH" ]; then
            echo "ไม่พบไฟล์ .app"
            exit 1
          fi

          echo "APP_PATH=$APP_PATH"

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          zip -r HTVANTIX.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HTVANTIX-IPA
          path: HTVANTIX.ipa
