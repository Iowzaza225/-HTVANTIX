name: Build HTV811 V4 IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    env:
      HTVANTIX_APP_TOKEN: ${{ secrets.HTVANTIX_APP_TOKEN }}
      BUNDLE_ID: com.apple.mobile.MobileHouseArrest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode
        run: |
          xcodebuild -version
          swift --version

      - name: Find and Extract ZIP
        run: |
          set -e

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name "HTV811_APP_ONLY_V4_KEY_SESSION_FIXED.zip" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "❌ ZIP not found"
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type f
            exit 1
          fi

          echo "✅ ZIP: $ZIP_FILE"

          rm -rf "$GITHUB_WORKSPACE/source"
          mkdir -p "$GITHUB_WORKSPACE/source"

          unzip -q "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/source"

      - name: Find Xcode Project
        run: |
          set -e

          PROJECT=$(find "$GITHUB_WORKSPACE/source" \
            -type d \
            -name "*.xcodeproj" \
            | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "❌ .xcodeproj not found"
            find "$GITHUB_WORKSPACE/source" -maxdepth 6 -print
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")
          PROJECT_NAME=$(basename "$PROJECT")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "PROJECT_NAME=$PROJECT_NAME" >> "$GITHUB_ENV"

          echo "✅ Project: $PROJECT"

      - name: Detect Scheme
        run: |
          set -e

          cd "$PROJECT_DIR"

          xcodebuild \
            -project "$PROJECT_NAME" \
            -list

          SCHEME=$(xcodebuild \
            -project "$PROJECT_NAME" \
            -list \
            | awk '
              /Schemes:/ {found=1; next}
              found && NF {
                gsub(/^[ \t]+|[ \t]+$/, "")
                print
                exit
              }
            ')

          if [ -z "$SCHEME" ]; then
            echo "❌ Scheme not found"
            exit 1
          fi

          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"
          echo "✅ Scheme: $SCHEME"

      - name: Check App Token
        run: |
          if [ -z "$HTVANTIX_APP_TOKEN" ]; then
            echo "❌ HTVANTIX_APP_TOKEN missing"
            exit 1
          fi

          echo "✅ APP TOKEN loaded"

      - name: Build Release
        run: |
          set -o pipefail

          cd "$PROJECT_DIR"

          xcodebuild \
            -project "$PROJECT_NAME" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            HTVANTIX_APP_TOKEN="$HTVANTIX_APP_TOKEN" \
            clean build \
            | tee "$GITHUB_WORKSPACE/xcodebuild.log"

      - name: Find Built APP
        run: |
          set -e

          APP_PATH=$(find "$GITHUB_WORKSPACE/build" \
            -type d \
            -name "*.app" \
            -path "*Release-iphoneos*" \
            | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "❌ APP not found"
            exit 1
          fi

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          echo "✅ APP: $APP_PATH"

      - name: Verify Bundle ID
        run: |
          set -e

          PLIST="$APP_PATH/Info.plist"

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleIdentifier $BUNDLE_ID" \
            "$PLIST"

          echo "Bundle ID:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$PLIST"

      - name: Remove Signing
        run: |
          rm -rf "$APP_PATH/_CodeSignature"
          rm -f "$APP_PATH/embedded.mobileprovision"

      - name: Create Unsigned IPA
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/ipa"
          mkdir -p "$GITHUB_WORKSPACE/ipa/Payload"

          cp -R "$APP_PATH" \
            "$GITHUB_WORKSPACE/ipa/Payload/"

          cd "$GITHUB_WORKSPACE/ipa"

          zip -qry \
            "$GITHUB_WORKSPACE/HTV811_V4_KEY_FIXED_unsigned.ipa" \
            Payload

          echo "✅ IPA CREATED"
          ls -lh "$GITHUB_WORKSPACE/HTV811_V4_KEY_FIXED_unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HTV811-V4-KEY-FIXED-IPA
          path: HTV811_V4_KEY_FIXED_unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HTV811-V4-BUILD-LOG
          path: xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
