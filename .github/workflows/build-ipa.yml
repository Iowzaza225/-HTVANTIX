name: Build HTVANTIX Final IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject app token
        shell: bash
        env:
          HTVANTIX_APP_TOKEN: ${{ secrets.HTVANTIX_APP_TOKEN }}
        run: |
          if [ -z "$HTVANTIX_APP_TOKEN" ]; then
            echo "ERROR: GitHub Secret HTVANTIX_APP_TOKEN is missing"
            exit 1
          fi

          /usr/libexec/PlistBuddy \
            -c "Set :HTVANTIXAppToken $HTVANTIX_APP_TOKEN" \
            HTVANTIX/Info.plist

          echo "App token injected"

      - name: Verify app info
        shell: bash
        run: |
          DISPLAY=$(/usr/libexec/PlistBuddy \
            -c "Print :CFBundleDisplayName" \
            HTVANTIX/Info.plist)

          VERSION=$(/usr/libexec/PlistBuddy \
            -c "Print :CFBundleShortVersionString" \
            HTVANTIX/Info.plist)

          BUILD=$(/usr/libexec/PlistBuddy \
            -c "Print :CFBundleVersion" \
            HTVANTIX/Info.plist)

          BUILD_ID=$(/usr/libexec/PlistBuddy \
            -c "Print :HTVANTIXBuildID" \
            HTVANTIX/Info.plist)

          echo "Display Name: $DISPLAY"
          echo "Version: $VERSION"
          echo "Build: $BUILD"
          echo "Build ID: $BUILD_ID"

          test "$DISPLAY" = "HTVANTIX"
          test "$VERSION" = "8.11"
          test "$BUILD" = "68"
          test "$BUILD_ID" = "HTV-811-68-V41"

      - name: Select Xcode
        run: |
          sudo xcode-select \
            -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Build HTVANTIX
        shell: bash
        run: |
          set +e

          rm -rf build

          xcodebuild \
            -project HTVANTIX.xcodeproj \
            -scheme HTVANTIX \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build \
            2>&1 | tee build.log

          STATUS=${PIPESTATUS[0]}

          echo ""
          echo "========== XCODE ERRORS =========="
          grep -nE ':[0-9]+:[0-9]+: (error|fatal error):' \
            build.log || true
          echo "=================================="

          exit $STATUS

      - name: Verify built app
        if: success()
        shell: bash
        run: |
          APP=$(find \
            build/Build/Products/Release-iphoneos \
            -maxdepth 1 \
            -type d \
            -name "*.app" \
            | head -1)

          if [ -z "$APP" ]; then
            echo "ERROR: Built .app not found"
            exit 1
          fi

          echo "APP=$APP"

          DISPLAY=$(/usr/libexec/PlistBuddy \
            -c "Print :CFBundleDisplayName" \
            "$APP/Info.plist")

          VERSION=$(/usr/libexec/PlistBuddy \
            -c "Print :CFBundleShortVersionString" \
            "$APP/Info.plist")

          BUILD=$(/usr/libexec/PlistBuddy \
            -c "Print :CFBundleVersion" \
            "$APP/Info.plist")

          BUILD_ID=$(/usr/libexec/PlistBuddy \
            -c "Print :HTVANTIXBuildID" \
            "$APP/Info.plist")

          echo "Built Name: $DISPLAY"
          echo "Built Version: $VERSION"
          echo "Built Build: $BUILD"
          echo "Built ID: $BUILD_ID"

          test "$DISPLAY" = "HTVANTIX"
          test "$VERSION" = "8.11"
          test "$BUILD" = "68"
          test "$BUILD_ID" = "HTV-811-68-V41"

      - name: Package unsigned IPA
        if: success()
        shell: bash
        run: |
          APP=$(find \
            build/Build/Products/Release-iphoneos \
            -maxdepth 1 \
            -type d \
            -name "*.app" \
            | head -1)

          rm -rf Payload
          mkdir -p Payload

          cp -R "$APP" Payload/

          rm -f HTVANTIX_8.11_68_unsigned.ipa

          zip -qry \
            HTVANTIX_8.11_68_unsigned.ipa \
            Payload

          echo ""
          echo "===== IPA CREATED ====="
          ls -lh HTVANTIX_8.11_68_unsigned.ipa

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: HTVANTIX-build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HTVANTIX-8.11-68-IPA
          path: HTVANTIX_8.11_68_unsigned.ipa
          if-no-files-found: error
