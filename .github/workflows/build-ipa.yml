name: Build HTVANTIX License Home IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify source
        shell: bash
        run: |
          SOURCE_ZIP="HTVANTIX_LICENSE_HOME_ONLY_FINAL_SOURCE.zip"

          if [ ! -f "$SOURCE_ZIP" ]; then
            echo "ERROR: Missing $SOURCE_ZIP"
            exit 1
          fi

          ls -lh "$SOURCE_ZIP"

      - name: Extract source
        shell: bash
        run: |
          rm -rf work
          mkdir -p work

          unzip -q HTVANTIX_LICENSE_HOME_ONLY_FINAL_SOURCE.zip -d work

          echo "===== XCODE PROJECT ====="
          find work -maxdepth 4 -type d -name "*.xcodeproj" -print

      - name: Inject app token
        shell: bash
        env:
          HTVANTIX_APP_TOKEN: ${{ secrets.HTVANTIX_APP_TOKEN }}
        run: |
          if [ -z "$HTVANTIX_APP_TOKEN" ]; then
            echo "ERROR: GitHub Secret HTVANTIX_APP_TOKEN is missing"
            exit 1
          fi

          PLIST=$(find work -type f -path "*/ThreeOneOSFive/Info.plist" | head -1)

          if [ -z "$PLIST" ]; then
            echo "ERROR: Info.plist not found"
            exit 1
          fi

          /usr/libexec/PlistBuddy \
            -c "Set :HTVANTIX_APP_TOKEN $HTVANTIX_APP_TOKEN" \
            "$PLIST" || \
          /usr/libexec/PlistBuddy \
            -c "Add :HTVANTIX_APP_TOKEN string $HTVANTIX_APP_TOKEN" \
            "$PLIST"

          echo "App token injected"

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Build HTVANTIX
        shell: bash
        run: |
          set +e

          PROJECT=$(find work -type d -name "*.xcodeproj" | head -1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Xcode project not found"
            exit 1
          fi

          SCHEME=$(xcodebuild \
            -project "$PROJECT" \
            -list \
            -json | \
            python3 -c 'import sys,json; d=json.load(sys.stdin); print(d["project"]["schemes"][0])')

          echo "PROJECT=$PROJECT"
          echo "SCHEME=$SCHEME"

          rm -rf build

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build \
            2>&1 | tee build.log

          STATUS=${PIPESTATUS[0]}

          echo ""
          echo "========== REAL XCODE ERRORS =========="
          grep -nE ':[0-9]+:[0-9]+: (error|fatal error):' build.log || true
          echo "======================================="

          exit $STATUS

      - name: Package IPA
        if: success()
        shell: bash
        run: |
          APP=$(find build/DerivedData/Build/Products/Release-iphoneos \
            -maxdepth 1 \
            -type d \
            -name "*.app" \
            | head -1)

          if [ -z "$APP" ]; then
            echo "ERROR: Built .app not found"
            exit 1
          fi

          rm -rf Payload
          mkdir -p Payload

          cp -R "$APP" Payload/

          rm -f HTVANTIX_LICENSE_HOME_unsigned.ipa

          zip -qry \
            HTVANTIX_LICENSE_HOME_unsigned.ipa \
            Payload

          ls -lh HTVANTIX_LICENSE_HOME_unsigned.ipa

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: HTVANTIX-LICENSE-HOME-build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HTVANTIX-LICENSE-HOME-IPA
          path: HTVANTIX_LICENSE_HOME_unsigned.ipa
          if-no-files-found: error
