name: Build HTVANTIX IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract HTVANTIX source
        run: |
          rm -rf work
          mkdir -p work
          unzip -q HTVANTIX_UI_CYBER_FINAL_V2_SOURCE.zip -d work
          echo "===== PROJECT FILES ====="
          find work -maxdepth 4 -type d -name "*.xcodeproj" -print

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Show schemes
        run: |
          PROJECT=$(find work -type d -name "*.xcodeproj" | head -1)
          if [ -z "$PROJECT" ]; then
            echo "Xcode project not found"
            exit 1
          fi
          echo "PROJECT=$PROJECT"
          xcodebuild -project "$PROJECT" -list

      - name: Build HTVANTIX app
        shell: bash
        run: |
          set +e
          PROJECT=$(find work -type d -name "*.xcodeproj" | head -1)

          if [ -z "$PROJECT" ]; then
            echo "Xcode project not found"
            exit 1
          fi

          SCHEME=$(xcodebuild -project "$PROJECT" -list -json | \
            python3 -c 'import sys,json; d=json.load(sys.stdin); print(d["project"]["schemes"][0])')

          echo "PROJECT=$PROJECT"
          echo "SCHEME=$SCHEME"

          rm -rf build

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build \
            2>&1 | tee build.log

          STATUS=${PIPESTATUS[0]}

          echo ""
          echo "========== REAL XCODE ERRORS =========="
          grep -nE ':[0-9]+:[0-9]+: (error|fatal error):' build.log || true
          echo "======================================="

          exit $STATUS

      - name: Package unsigned IPA
        if: success()
        shell: bash
        run: |
          APP=$(find build/DerivedData/Build/Products/Release-iphoneos \
            -maxdepth 1 -type d -name "*.app" | head -1)

          if [ -z "$APP" ]; then
            echo "Built .app not found"
            exit 1
          fi

          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry HTVANTIX_unsigned.ipa Payload

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: HTVANTIX-build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HTVANTIX-unsigned-ipa
          path: HTVANTIX_unsigned.ipa
          if-no-files-found: error
