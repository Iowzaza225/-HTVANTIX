name: Build 3105 IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect repository
        run: |
          echo "=== ROOT ==="
          pwd
          ls -la

          echo "=== XCODE PROJECTS ==="
          find . -type d -name "*.xcodeproj" -print

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Detect project and scheme
        run: |
          PROJECT="$(find . -type d -name "*.xcodeproj" | head -1)"

          if [ -z "$PROJECT" ]; then
            echo "ERROR: no .xcodeproj found"
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT"

          echo "=== PROJECT INFO ==="
          xcodebuild -project "$PROJECT" -list

          SCHEME="$(xcodebuild -project "$PROJECT" -list 2>/dev/null \
            | awk '/Schemes:/{flag=1;next} flag && NF {gsub(/^[ \t]+|[ \t]+$/, ""); print; exit}')"

          if [ -z "$SCHEME" ]; then
            echo "ERROR: scheme not found"
            exit 1
          fi

          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"
          echo "Using scheme: $SCHEME"

      - name: Build App
        run: |
          echo "Project: $PROJECT"
          echo "Scheme: $SCHEME"

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Find App
        run: |
          echo "=== APP OUTPUT ==="
          find build -type d -name "*.app" -print

      - name: Create IPA
        run: |
          APP="$(find build -type d -name "*.app" | head -1)"

          if [ -z "$APP" ]; then
            echo "ERROR: .app not found"
            exit 1
          fi

          echo "Found app: $APP"

          rm -rf Payload
          mkdir -p Payload

          cp -R "$APP" Payload/

          /usr/bin/zip -qry 3105-unsigned.ipa Payload

          echo "=== IPA CREATED ==="
          ls -lh 3105-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 3105-IPA
          path: 3105-unsigned.ipa
          if-no-files-found: error
