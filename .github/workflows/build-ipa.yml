name: Build HTVANTIX DISPLAY FIX V2

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Source ZIP
        shell: bash
        run: |
          ZIP_FILE="./HTVANTIX_DISPLAY_NAME_ONLY_FIX.zip"

          echo "=== ZIP FILES ==="
          find . -maxdepth 1 -type f -name "*.zip" -print

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ไม่พบ $ZIP_FILE"
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract Source
        shell: bash
        run: |
          rm -rf source
          mkdir -p source

          unzip -q "$ZIP_FILE" -d source

          echo "=== XCODE PROJECTS ==="
          find source -type d -name "*.xcodeproj" -print

      - name: Find Xcode Project
        shell: bash
        run: |
          PROJECT="$(find source -type d -name "*.xcodeproj" | head -1)"

          if [ -z "$PROJECT" ]; then
            echo "ERROR: ไม่พบ .xcodeproj"
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT"

      - name: Select Xcode
        shell: bash
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Detect Scheme
        shell: bash
        run: |
          xcodebuild -project "$PROJECT" -list

          SCHEME="$(xcodebuild \
            -project "$PROJECT" \
            -list 2>/dev/null |
            awk '/Schemes:/{flag=1;next} flag && NF {
              gsub(/^[ \t]+|[ \t]+$/, "");
              print;
              exit
            }')"

          if [ -z "$SCHEME" ]; then
            echo "ERROR: ไม่พบ Scheme"
            exit 1
          fi

          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"
          echo "Using scheme: $SCHEME"

      - name: Build Client
        shell: bash
        run: |
          set -o pipefail

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log

      - name: Find Built App
        shell: bash
        run: |
          APP="$(find "$GITHUB_WORKSPACE/build" \
            -type d \
            -name "*.app" \
            | head -1)"

          if [ -z "$APP" ]; then
            echo "ERROR: ไม่พบ .app"
            exit 1
          fi

          echo "APP=$APP" >> "$GITHUB_ENV"
          echo "Found app: $APP"

      - name: Create IPA
        shell: bash
        run: |
          rm -rf Payload
          mkdir -p Payload

          cp -R "$APP" Payload/

          /usr/bin/zip \
            -qry \
            HTVANTIX-DISPLAY-FIX-V2.ipa \
            Payload

          ls -lh HTVANTIX-DISPLAY-FIX-V2.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HTVANTIX-DISPLAY-FIX-V2-${{ github.run_number }}
          path: HTVANTIX-DISPLAY-FIX-V2.ipa
          if-no-files-found: error

      - name: Show Compiler Errors
        if: failure()
        shell: bash
        run: |
          grep -n -i \
            -E "error:|fatal error:|BUILD FAILED|SwiftCompile" \
            xcodebuild.log | tail -100 || true

      - name: Upload Build Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: HTVANTIX-DISPLAY-FIX-V2-LOG-${{ github.run_number }}
          path: xcodebuild.log
          if-no-files-found: ignore
