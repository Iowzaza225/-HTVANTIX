      - name: Build HTVANTIX app
        shell: bash
        run: |
          set +e

          PROJECT=$(find work -type d -name "*.xcodeproj" | head -1)

          SCHEME=$(xcodebuild -project "$PROJECT" -list -json | \
            python3 -c 'import sys,json; d=json.load(sys.stdin); print(d["project"]["schemes"][0])')

          echo "PROJECT=$PROJECT"
          echo "SCHEME=$SCHEME"

          rm -rf build

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build \
            2>&1 | tee build.log

          STATUS=${PIPESTATUS[0]}

          echo ""
          echo "========== REAL XCODE ERRORS =========="
          grep -nE ':[0-9]+:[0-9]+: (error|fatal error):' build.log || true
          echo "======================================="

          exit $STATUS
