name: Build 3105 IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show project files
        run: |
          pwd
          ls -la
          find . -maxdepth 3 -name "*.xcodeproj" -print

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Build App
        run: |
          cd 3105-main

          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -scheme ThreeOneOSFive \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Find App
        run: |
          echo "=== APP OUTPUT ==="
          find 3105-main/build -type d -name "*.app" -print

      - name: Create IPA
        run: |
          APP="$(find 3105-main/build -type d -name "*.app" | head -1)"

          if [ -z "$APP" ]; then
            echo "ERROR: ไม่พบไฟล์ .app"
            exit 1
          fi

          echo "Found app: $APP"

          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/

          /usr/bin/zip -qry 3105-unsigned.ipa Payload

          echo "=== IPA CREATED ==="
          ls -lh 3105-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 3105-IPA
          path: 3105-unsigned.ipa
          if-no-files-found: error
