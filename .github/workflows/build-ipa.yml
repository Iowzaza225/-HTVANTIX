name: HTVANTIX BUILD

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        shell: bash
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version

      - name: Prepare Source
        shell: bash
        run: |
          set -e

          ZIP_FILE="./HTVANTIX_CLIENT_V1.1.2_BUILD8_ALL_FIX.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ไม่พบ $ZIP_FILE"
            echo "=== ROOT FILES ==="
            ls -lah
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

          rm -rf source
          mkdir -p source
          unzip -q "$ZIP_FILE" -d source

          PROJECT="$(find source -type d -name '*.xcodeproj' -print -quit)"
          if [ -z "$PROJECT" ]; then
            echo "ERROR: ไม่พบ .xcodeproj"
            exit 1
          fi

          INFO_PLIST="$(find source -type f -path '*/ThreeOneOSFive/Info.plist' -print -quit)"
          if [ -z "$INFO_PLIST" ]; then
            echo "ERROR: ไม่พบ Info.plist"
            exit 1
          fi

          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.1.2" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 8" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Set :AppReleaseDisplayVersion 1.1.2" "$INFO_PLIST"

          echo "=== VERSION GATE VALUES ==="
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Print :AppReleaseDisplayVersion" "$INFO_PLIST"

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "SCHEME=3105" >> "$GITHUB_ENV"

          echo "PROJECT: $PROJECT"
          echo "SCHEME: 3105"

      - name: Verify Scheme
        shell: bash
        run: |
          xcodebuild -project "$PROJECT" -list
          echo "Using scheme: $SCHEME"

      - name: Build HTVANTIX
        shell: bash
        run: |
          set -o pipefail

          rm -rf "$GITHUB_WORKSPACE/build"
          rm -rf "$GITHUB_WORKSPACE/Payload"
          rm -f "$GITHUB_WORKSPACE/HTVANTIX.ipa"
          rm -f "$GITHUB_WORKSPACE/xcodebuild.log"

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            MARKETING_VERSION=1.1.2 \
            CURRENT_PROJECT_VERSION=8 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build \
            2>&1 | tee "$GITHUB_WORKSPACE/xcodebuild.log"

      - name: Verify Built App Version
        shell: bash
        run: |
          APP_PATH="$(find "$GITHUB_WORKSPACE/build" -type d -path '*Release-iphoneos/*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: ไม่พบ .app สำหรับตรวจ version"
            exit 1
          fi
          BUILT_PLIST="$APP_PATH/Info.plist"
          echo "Built CFBundleShortVersionString: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$BUILT_PLIST")"
          echo "Built CFBundleVersion: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$BUILT_PLIST")"
          echo "Built AppReleaseDisplayVersion: $(/usr/libexec/PlistBuddy -c 'Print :AppReleaseDisplayVersion' "$BUILT_PLIST")"

      - name: Create IPA
        shell: bash
        run: |
          APP_PATH="$(find "$GITHUB_WORKSPACE/build" -type d -path '*Release-iphoneos/*.app' -print -quit)"

          if [ -z "$APP_PATH" ]; then
            APP_PATH="$(find "$GITHUB_WORKSPACE/build" -type d -name '*.app' -print -quit)"
          fi

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: ไม่พบ .app"
            exit 1
          fi

          cd "$GITHUB_WORKSPACE"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          /usr/bin/zip -qry HTVANTIX.ipa Payload

          echo "=== IPA CREATED ==="
          ls -lh HTVANTIX.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HTVANTIX-V1.1.2-BUILD8-426-FIX-${{ github.run_number }}
          path: HTVANTIX.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Show Errors
        if: failure()
        shell: bash
        run: |
          if [ -f "$GITHUB_WORKSPACE/xcodebuild.log" ]; then
            echo "=== COMPILER ERRORS ==="
            grep -n -i -E 'error:|fatal error:|BUILD FAILED|SwiftCompile|CompileSwift' "$GITHUB_WORKSPACE/xcodebuild.log" | tail -200 || true
          fi

      - name: Upload Build Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: HTVANTIX-V1.1.2-BUILD8-426-FIX-LOG-${{ github.run_number }}
          path: xcodebuild.log
          if-no-files-found: ignore
