name: HTVANTIX PREMIUM BUILD V4

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "HTVANTIX_PREMIUM_FINAL_01.zip"
      - ".github/workflows/htvantix-premium-v4.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        shell: bash
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version

      - name: Check ZIP
        shell: bash
        run: |
          ZIP_FILE="./HTVANTIX_PREMIUM_FINAL_01.zip"

          echo "===== ROOT FILES ====="
          ls -lah

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ไม่พบ $ZIP_FILE"
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"
          echo "FOUND ZIP: $ZIP_FILE"

      - name: Extract Project
        shell: bash
        run: |
          rm -rf source
          mkdir -p source

          unzip -q "$ZIP_FILE" -d source

          echo "===== MARKER ====="
          cat source/HTVANTIX_PREMIUM_FINAL_01_MARKER.txt || true

          echo "===== XCODE PROJECT ====="
          find source -type d -name "*.xcodeproj" -print

      - name: Find Project
        shell: bash
        run: |
          PROJECT="$(find source \
            -type d \
            -name "*.xcodeproj" \
            -print -quit)"

          if [ -z "$PROJECT" ]; then
            echo "ERROR: ไม่พบ Xcode Project"
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "PROJECT: $PROJECT"

      - name: Detect Target
        shell: bash
        run: |
          xcodebuild \
            -project "$PROJECT" \
            -list \
            -json > project.json

          python3 <<'PY'
          import json

          with open("project.json", "r") as f:
              data = json.load(f)

          targets = data.get("project", {}).get("targets", [])

          print("TARGETS:", targets)

          if not targets:
              raise SystemExit("ERROR: ไม่พบ Target")

          target = "3105" if "3105" in targets else targets[0]

          print("SELECTED TARGET:", target)

          with open("target.txt", "w") as f:
              f.write(target)
          PY

          TARGET="$(cat target.txt)"
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"

      - name: Clean
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/build"
          rm -rf "$GITHUB_WORKSPACE/Payload"
          rm -f "$GITHUB_WORKSPACE/HTVANTIX-PREMIUM-V4.ipa"
          rm -f "$GITHUB_WORKSPACE/xcodebuild.log"

      - name: Build HTVANTIX
        shell: bash
        run: |
          set -o pipefail

          echo "===== HTVANTIX PREMIUM BUILD V4 ====="
          echo "ZIP     : $ZIP_FILE"
          echo "PROJECT : $PROJECT"
          echo "TARGET  : $TARGET"

          xcodebuild \
            -project "$PROJECT" \
            -target "$TARGET" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build \
            2>&1 | tee "$GITHUB_WORKSPACE/xcodebuild.log"

      - name: Find Built App
        shell: bash
        run: |
          APP_PATH="$(find "$GITHUB_WORKSPACE/build" \
            -type d \
            -path "*Release-iphoneos/*.app" \
            -print -quit)"

          if [ -z "$APP_PATH" ]; then
            APP_PATH="$(find "$GITHUB_WORKSPACE/build" \
              -type d \
              -name "*.app" \
              -print -quit)"
          fi

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: ไม่พบ .app"
            exit 1
          fi

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          echo "APP: $APP_PATH"

      - name: Check App Info
        shell: bash
        run: |
          echo "===== APP INFO ====="

          echo "Display Name:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleDisplayName" \
            "$APP_PATH/Info.plist" || true

          echo "Bundle Name:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleName" \
            "$APP_PATH/Info.plist" || true

          echo "Bundle ID:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$APP_PATH/Info.plist" || true

      - name: Create IPA
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"

          rm -rf Payload
          mkdir -p Payload

          cp -R "$APP_PATH" Payload/

          /usr/bin/zip \
            -qry \
            HTVANTIX-PREMIUM-V4.ipa \
            Payload

          echo "===== IPA CREATED ====="
          ls -lh HTVANTIX-PREMIUM-V4.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HTVANTIX-PREMIUM-V4-${{ github.run_number }}
          path: HTVANTIX-PREMIUM-V4.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Show Errors
        if: failure()
        shell: bash
        run: |
          if [ -f "$GITHUB_WORKSPACE/xcodebuild.log" ]; then
            grep -n -i \
              -E "error:|fatal error:|BUILD FAILED|SwiftCompile|CompileSwift" \
              "$GITHUB_WORKSPACE/xcodebuild.log" \
              | tail -150 || true
          fi

      - name: Upload Build Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: HTVANTIX-PREMIUM-V4-LOG-${{ github.run_number }}
          path: xcodebuild.log
          if-no-files-found: ignore
