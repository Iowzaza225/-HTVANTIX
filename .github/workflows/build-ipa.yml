name: Build HTVANTIX IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    env:
      HTVANTIX_APP_TOKEN: ${{ secrets.HTVANTIX_APP_TOKEN }}
      BUNDLE_ID: com.apple.mobile.MobileHouseArrest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode Version
        run: |
          xcodebuild -version
          swift --version

      - name: Find ZIP
        run: |
          set -e

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -maxdepth 2 \
            -type f \
            -name "*.zip" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "❌ ZIP NOT FOUND"
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type f
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"
          echo "✅ ZIP: $ZIP_FILE"

      - name: Extract ZIP
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/source"
          mkdir -p "$GITHUB_WORKSPACE/source"

          unzip -q "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/source"

          echo "✅ ZIP EXTRACTED"

      - name: Find Xcode Project
        run: |
          set -e

          PROJECT=$(find "$GITHUB_WORKSPACE/source" \
            -type d \
            -name "*.xcodeproj" \
            | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "❌ XCODE PROJECT NOT FOUND"
            find "$GITHUB_WORKSPACE/source" -maxdepth 6 -print
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")
          PROJECT_NAME=$(basename "$PROJECT")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "PROJECT_NAME=$PROJECT_NAME" >> "$GITHUB_ENV"

          echo "✅ PROJECT: $PROJECT"

      - name: Detect Scheme
        run: |
          set -e

          cd "$PROJECT_DIR"

          xcodebuild \
            -project "$PROJECT_NAME" \
            -list

          SCHEME=$(xcodebuild \
            -project "$PROJECT_NAME" \
            -list \
            | awk '
              /Schemes:/ {found=1; next}
              found && NF {
                gsub(/^[ \t]+|[ \t]+$/, "")
                print
                exit
              }
            ')

          if [ -z "$SCHEME" ]; then
            echo "❌ SCHEME NOT FOUND"
            exit 1
          fi

          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"
          echo "✅ SCHEME: $SCHEME"

      - name: Check App Token
        run: |
          set -e

          if [ -z "$HTVANTIX_APP_TOKEN" ]; then
            echo "❌ HTVANTIX_APP_TOKEN NOT FOUND"
            exit 1
          fi

          echo "✅ APP TOKEN FOUND"

      - name: Build Release
        run: |
          set -o pipefail

          cd "$PROJECT_DIR"

          xcodebuild \
            -project "$PROJECT_NAME" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            HTVANTIX_APP_TOKEN="$HTVANTIX_APP_TOKEN" \
            clean build \
            | tee "$GITHUB_WORKSPACE/xcodebuild.log"

      - name: Find Built APP
        run: |
          set -e

          APP_PATH=$(find "$GITHUB_WORKSPACE/build" \
            -type d \
            -name "*.app" \
            -path "*Release-iphoneos*" \
            | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "❌ APP NOT FOUND"
            exit 1
          fi

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          echo "✅ APP: $APP_PATH"

      - name: Set Bundle ID
        run: |
          set -e

          PLIST="$APP_PATH/Info.plist"

          if [ ! -f "$PLIST" ]; then
            echo "❌ Info.plist NOT FOUND"
            exit 1
          fi

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleIdentifier $BUNDLE_ID" \
            "$PLIST"

          echo "✅ BUNDLE ID:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$PLIST"

      - name: Remove Old Signing
        run: |
          set -e

          rm -rf "$APP_PATH/_CodeSignature"
          rm -f "$APP_PATH/embedded.mobileprovision"

          echo "✅ OLD SIGNING REMOVED"

      - name: Create IPA
        run: |
          set -e

          IPA_NAME="HTVANTIX_${GITHUB_RUN_NUMBER}.ipa"

          rm -rf "$GITHUB_WORKSPACE/ipa"
          mkdir -p "$GITHUB_WORKSPACE/ipa/Payload"

          cp -R "$APP_PATH" \
            "$GITHUB_WORKSPACE/ipa/Payload/"

          cd "$GITHUB_WORKSPACE/ipa"

          zip -qry \
            "$GITHUB_WORKSPACE/$IPA_NAME" \
            Payload

          echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"

          echo "✅ CREATED: $IPA_NAME"
          ls -lh "$GITHUB_WORKSPACE/$IPA_NAME"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HTVANTIX-${{ github.run_number }}
          path: ${{ env.IPA_NAME }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HTVANTIX-BUILD-LOG-${{ github.run_number }}
          path: xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
