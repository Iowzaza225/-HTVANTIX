name: Build HTVANTIX IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    env:
      HTVANTIX_APP_TOKEN: ${{ secrets.HTVANTIX_APP_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode version
        run: |
          xcodebuild -version
          swift --version

      - name: Extract source
        run: |
          set -e

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found"
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          rm -rf "$GITHUB_WORKSPACE/extracted"
          mkdir -p "$GITHUB_WORKSPACE/extracted"

          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/extracted"

      - name: Find Xcode project
        run: |
          set -e

          PROJECT=$(find "$GITHUB_WORKSPACE/extracted" -type d -name "*.xcodeproj" | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Xcode project not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")
          PROJECT_NAME=$(basename "$PROJECT")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "PROJECT_NAME=$PROJECT_NAME" >> "$GITHUB_ENV"

          echo "Found project: $PROJECT"

      - name: Show schemes
        run: |
          cd "$PROJECT_DIR"

          xcodebuild \
            -project "$PROJECT_NAME" \
            -list

      - name: Check app token
        run: |
          if [ -z "$HTVANTIX_APP_TOKEN" ]; then
            echo "WARNING: HTVANTIX_APP_TOKEN is empty"
          else
            echo "HTVANTIX_APP_TOKEN detected"
          fi

      - name: Build
        run: |
          set -o pipefail

          cd "$PROJECT_DIR"

          xcodebuild \
            -project "$PROJECT_NAME" \
            -scheme HTVANTIX \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            HTVANTIX_APP_TOKEN="$HTVANTIX_APP_TOKEN" \
            clean build \
            | tee "$GITHUB_WORKSPACE/xcodebuild.log"

      - name: Find app
        run: |
          set -e

          APP_PATH=$(find "$GITHUB_WORKSPACE/build" \
            -type d \
            -name "*.app" \
            -path "*Release-iphoneos*" \
            | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app not found"
            exit 1
          fi

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          echo "Found app: $APP_PATH"

      - name: Create IPA
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/ipa"
          mkdir -p "$GITHUB_WORKSPACE/ipa/Payload"

          cp -R "$APP_PATH" "$GITHUB_WORKSPACE/ipa/Payload/"

          cd "$GITHUB_WORKSPACE/ipa"

          zip -qry \
            "$GITHUB_WORKSPACE/HTVANTIX.ipa" \
            Payload

          ls -lh "$GITHUB_WORKSPACE/HTVANTIX.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HTVANTIX-IPA
          path: HTVANTIX.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HTVANTIX-Build-Log
          path: xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
