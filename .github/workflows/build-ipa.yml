name: HTVANTIX BUILD

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        shell: bash
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version

      - name: Prepare Source
        shell: bash
        run: |
          set -e
          ZIP_FILE="./HTVANTIX_HARDENING_V2_SESSION_PERSIST_FIX.zip"
          [ -f "$ZIP_FILE" ] || { echo "ERROR: ไม่พบ $ZIP_FILE"; exit 1; }
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

          rm -rf source
          mkdir -p source
          unzip -q "$ZIP_FILE" -d source

          PROJECT="$(find source -type d -name '*.xcodeproj' -print -quit)"
          [ -n "$PROJECT" ] || { echo "ERROR: ไม่พบ .xcodeproj"; exit 1; }
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "PROJECT: $PROJECT"

          echo "SCHEME=3105" >> "$GITHUB_ENV"
          echo "SCHEME: 3105"

      - name: Fix Duplicate App Init
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('source/Client/ThreeOneOSFive/App.swift')
          if not p.exists():
              raise SystemExit('ERROR: ไม่พบ App.swift')

          s = p.read_text(encoding='utf-8')
          m = re.search(r'@main\s+struct\s+\w+\s*:\s*App\s*\{', s)
          if not m:
              raise SystemExit('ERROR: ไม่พบ @main App')

          start = m.end()

          def init_positions(text):
              return [start + x.start() for x in re.finditer(r'\n\s*init\(\)\s*\{', text[start:])]

          while len(init_positions(s)) > 1:
              pos = init_positions(s)[1]
              op = s.find('{', pos)
              depth = 0
              end = None
              for i in range(op, len(s)):
                  if s[i] == '{': depth += 1
                  elif s[i] == '}':
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break
              if end is None:
                  raise SystemExit('ERROR: init block ไม่สมบูรณ์')
              s = s[:pos] + s[end:]

          p.write_text(s, encoding='utf-8')
          print('INIT CHECK: PASS')
          PY

      - name: Verify Scheme
        shell: bash
        run: |
          xcodebuild -project "$PROJECT" -list
          echo "Using fixed scheme: $SCHEME"

      - name: Build HTVANTIX
        shell: bash
        run: |
          set -o pipefail
          rm -rf "$GITHUB_WORKSPACE/build" "$GITHUB_WORKSPACE/Payload"
          rm -f "$GITHUB_WORKSPACE/HTVANTIX.ipa" "$GITHUB_WORKSPACE/xcodebuild.log"

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build \
            2>&1 | tee "$GITHUB_WORKSPACE/xcodebuild.log"

      - name: Create IPA
        shell: bash
        run: |
          APP_PATH="$(find "$GITHUB_WORKSPACE/build" -type d -path '*Release-iphoneos/*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            APP_PATH="$(find "$GITHUB_WORKSPACE/build" -type d -name '*.app' -print -quit)"
          fi
          [ -n "$APP_PATH" ] || { echo "ERROR: ไม่พบ .app"; exit 1; }

          cd "$GITHUB_WORKSPACE"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -qry HTVANTIX.ipa Payload
          ls -lh HTVANTIX.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HTVANTIX-${{ github.run_number }}
          path: HTVANTIX.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Show Errors
        if: failure()
        shell: bash
        run: |
          if [ -f "$GITHUB_WORKSPACE/xcodebuild.log" ]; then
            grep -n -i -E 'error:|fatal error:|BUILD FAILED|SwiftCompile|CompileSwift' "$GITHUB_WORKSPACE/xcodebuild.log" | tail -200 || true
          fi

      - name: Upload Build Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: HTVANTIX-LOG-${{ github.run_number }}
          path: xcodebuild.log
          if-no-files-found: ignore
