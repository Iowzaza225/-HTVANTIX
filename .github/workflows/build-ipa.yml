name: Build HTVANTIX Final UI IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify source
        shell: bash
        run: |
          SOURCE_ZIP="HTVANTIX_FINAL_UI_MERGED_SOURCE.zip"

          if [ ! -f "$SOURCE_ZIP" ]; then
            echo "ERROR: Missing $SOURCE_ZIP"
            exit 1
          fi

          echo "FOUND SOURCE:"
          ls -lh "$SOURCE_ZIP"

      - name: Extract source
        shell: bash
        run: |
          rm -rf work
          mkdir -p work

          unzip -q HTVANTIX_FINAL_UI_MERGED_SOURCE.zip -d work

          echo "===== XCODE PROJECT ====="
          find work -maxdepth 4 -type d -name "*.xcodeproj" -print

      - name: Inject app token
        shell: bash
        env:
          HTVANTIX_APP_TOKEN: ${{ secrets.HTVANTIX_APP_TOKEN }}
        run: |
          if [ -z "$HTVANTIX_APP_TOKEN" ]; then
            echo "ERROR: GitHub Secret HTVANTIX_APP_TOKEN is missing"
            exit 1
          fi

          PLIST=$(find work -type f -path "*/ThreeOneOSFive/Info.plist" | head -1)

          if [ -z "$PLIST" ]; then
            echo "ERROR: Info.plist not found"
            exit 1
          fi

          /usr/libexec/PlistBuddy \
            -c "Set :HTVANTIX_APP_TOKEN $HTVANTIX_APP_TOKEN" \
            "$PLIST" || \
          /usr/libexec/PlistBuddy \
            -c "Add :HTVANTIX_APP_TOKEN string $HTVANTIX_APP_TOKEN" \
            "$PLIST"

          echo "App token injected"

      - name: Verify branding before build
        shell: bash
        run: |
          PBX="work/ThreeOneOSFive.xcodeproj/project.pbxproj"
          PLIST="work/ThreeOneOSFive/Info.plist"

          DISPLAY=$(/usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$PLIST")
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST")

          echo "Display name: $DISPLAY"
          echo "Version: $VERSION"

          test "$DISPLAY" = "HTVANTIX" || {
            echo "ERROR: Wrong app display name"
            exit 1
          }

          test "$VERSION" = "8.11" || {
            echo "ERROR: Wrong app version"
            exit 1
          }

          grep -q 'INFOPLIST_KEY_CFBundleDisplayName = HTVANTIX;' "$PBX" || {
            echo "ERROR: Xcode display name override is wrong"
            exit 1
          }

          grep -q 'PRODUCT_NAME = HTVANTIX;' "$PBX" || {
            echo "ERROR: Product name is wrong"
            exit 1
          }

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Build HTVANTIX
        shell: bash
        run: |
          set +e

          PROJECT=$(find work -type d -name "*.xcodeproj" | head -1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Xcode project not found"
            exit 1
          fi

          SCHEME=$(xcodebuild \
            -project "$PROJECT" \
            -list \
            -json | \
            python3 -c 'import sys,json; d=json.load(sys.stdin); print(d["project"]["schemes"][0])')

          echo "PROJECT=$PROJECT"
          echo "SCHEME=$SCHEME"

          rm -rf build

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build \
            2>&1 | tee build.log

          STATUS=${PIPESTATUS[0]}

          echo ""
          echo "========== REAL XCODE ERRORS =========="
          grep -nE ':[0-9]+:[0-9]+: (error|fatal error):' build.log || true
          echo "======================================="

          exit $STATUS

      - name: Verify built app branding
        if: success()
        shell: bash
        run: |
          APP=$(find build/DerivedData/Build/Products/Release-iphoneos \
            -maxdepth 1 \
            -type d \
            -name "*.app" \
            | head -1)

          if [ -z "$APP" ]; then
            echo "ERROR: Built .app not found"
            exit 1
          fi

          DISPLAY=$(/usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$APP/Info.plist")
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist")

          echo "BUILT DISPLAY NAME=$DISPLAY"
          echo "BUILT VERSION=$VERSION"

          test "$DISPLAY" = "HTVANTIX" || {
            echo "ERROR: Built app is not named HTVANTIX"
            exit 1
          }

          test "$VERSION" = "8.11" || {
            echo "ERROR: Built app version is not 8.11"
            exit 1
          }

      - name: Package IPA
        if: success()
        shell: bash
        run: |
          APP=$(find build/DerivedData/Build/Products/Release-iphoneos \
            -maxdepth 1 \
            -type d \
            -name "*.app" \
            | head -1)

          rm -rf Payload
          mkdir -p Payload

          cp -R "$APP" Payload/

          rm -f HTVANTIX_8.11_FINAL_UI_unsigned.ipa

          zip -qry \
            HTVANTIX_8.11_FINAL_UI_unsigned.ipa \
            Payload

          echo ""
          echo "===== IPA CREATED ====="
          ls -lh HTVANTIX_8.11_FINAL_UI_unsigned.ipa

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: HTVANTIX-FINAL-UI-build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HTVANTIX-8.11-FINAL-UI-IPA
          path: HTVANTIX_8.11_FINAL_UI_unsigned.ipa
          if-no-files-found: error
