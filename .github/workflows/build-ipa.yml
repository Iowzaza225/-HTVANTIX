name: Build 3105 IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show project files
        run: |
          pwd
          ls -la

      - name: Install Theos
        run: |
          brew install make ldid
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Build
        run: |
          export THEOS=$HOME/theos
          export PATH="$THEOS/bin:$PATH"

          make clean
          make -j2

      - name: Create IPA
        run: |
          APP=$(find . -type d -name "*.app" | head -1)

          if [ -z "$APP" ]; then
            echo "ERROR: ไม่พบ .app"
            exit 1
          fi

          echo "Found: $APP"

          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/

          zip -qry 3105-unsigned.ipa Payload

          ls -lh 3105-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 3105-IPA
          path: 3105-unsigned.ipa
