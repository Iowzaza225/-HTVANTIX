name: Build HTVANTIX Final IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract HTVANTIX source
        shell: bash
        run: |
          set -e

          echo "===== REPOSITORY FILES ====="
          find . -maxdepth 2 -type f -print

          SOURCE_ZIP=""

          for ZIP in ./*.zip; do
            [ -f "$ZIP" ] || continue

            if unzip -l "$ZIP" | grep -q "HTVANTIX/Info.plist"; then
              SOURCE_ZIP="$ZIP"
              break
            fi
          done

          if [ -z "$SOURCE_ZIP" ]; then
            echo "ERROR: No HTVANTIX source ZIP found"
            exit 1
          fi

          echo "SOURCE ZIP=$SOURCE_ZIP"

          rm -rf work
          mkdir -p work

          unzip -q "$SOURCE_ZIP" -d work

          echo ""
          echo "===== EXTRACTED SOURCE ====="
          find work -maxdepth 3 -type f -print

          test -f work/HTVANTIX/Info.plist || {
            echo "ERROR: HTVANTIX/Info.plist not found after extraction"
            exit 1
          }

          test -d work/HTVANTIX.xcodeproj || {
            echo "ERROR: HTVANTIX.xcodeproj not found"
            exit 1
          }

      - name: Inject app token
        shell: bash
        env:
          HTVANTIX_APP_TOKEN: ${{ secrets.HTVANTIX_APP_TOKEN }}
        run: |
          set -e

          if [ -z "$HTVANTIX_APP_TOKEN" ]; then
            echo "ERROR: GitHub Secret HTVANTIX_APP_TOKEN is missing"
            exit 1
          fi

          PLIST="work/HTVANTIX/Info.plist"

          /usr/libexec/PlistBuddy \
            -c "Set :HTVANTIXAppToken $HTVANTIX_APP_TOKEN" \
            "$PLIST"

          echo "App token injected successfully"

      - name: Verify app info
        shell: bash
        run: |
          set -e

          PLIST="work/HTVANTIX/Info.plist"

          DISPLAY=$(/usr/libexec/PlistBuddy \
            -c "Print :CFBundleDisplayName" "$PLIST")

          VERSION=$(/usr/libexec/PlistBuddy \
            -c "Print :CFBundleShortVersionString" "$PLIST")

          BUILD=$(/usr/libexec/PlistBuddy \
            -c "Print :CFBundleVersion" "$PLIST")

          BUILD_ID=$(/usr/libexec/PlistBuddy \
            -c "Print :HTVANTIXBuildID" "$PLIST")

          echo "Display Name: $DISPLAY"
          echo "Version: $VERSION"
          echo "Build: $BUILD"
          echo "Build ID: $BUILD_ID"

          test "$DISPLAY" = "HTVANTIX"
          test "$VERSION" = "8.11"
          test "$BUILD" = "68"
          test "$BUILD_ID" = "HTV-811-68-V41"

      - name: Select Xcode
        shell: bash
        run: |
          sudo xcode-select \
            -s /Applications/Xcode.app/Contents/Developer

          xcodebuild -version

      - name: Build HTVANTIX
        shell: bash
        run: |
          set +e

          rm -rf build

          xcodebuild \
            -project work/HTVANTIX.xcodeproj \
            -scheme HTVANTIX \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build \
            2>&1 | tee build.log

          STATUS=${PIPESTATUS[0]}

          echo ""
          echo "========== REAL XCODE ERRORS =========="
          grep -nE ':[0-9]+:[0-9]+: (error|fatal error):' \
            build.log || true
          echo "======================================="

          exit $STATUS

      - name: Verify built app
        if: success()
        shell: bash
        run: |
          set -e

          APP=$(find \
            build/Build/Products/Release-iphoneos \
            -maxdepth 1 \
            -type d \
            -name "*.app" \
            | head -1)

          if [ -z "$APP" ]; then
            echo "ERROR: Built .app not found"
            exit 1
          fi

          echo "APP=$APP"

          DISPLAY=$(/usr/libexec/PlistBuddy \
            -c "Print :CFBundleDisplayName" \
            "$APP/Info.plist")

          VERSION=$(/usr/libexec/PlistBuddy \
            -c "Print :CFBundleShortVersionString" \
            "$APP/Info.plist")

          BUILD=$(/usr/libexec/PlistBuddy \
            -c "Print :CFBundleVersion" \
            "$APP/Info.plist")

          BUILD_ID=$(/usr/libexec/PlistBuddy \
            -c "Print :HTVANTIXBuildID" \
            "$APP/Info.plist")

          echo "Built Name: $DISPLAY"
          echo "Built Version: $VERSION"
          echo "Built Build: $BUILD"
          echo "Built ID: $BUILD_ID"

          test "$DISPLAY" = "HTVANTIX"
          test "$VERSION" = "8.11"
          test "$BUILD" = "68"
          test "$BUILD_ID" = "HTV-811-68-V41"

      - name: Package unsigned IPA
        if: success()
        shell: bash
        run: |
          set -e

          APP=$(find \
            build/Build/Products/Release-iphoneos \
            -maxdepth 1 \
            -type d \
            -name "*.app" \
            | head -1)

          if [ -z "$APP" ]; then
            echo "ERROR: Built .app not found"
            exit 1
          fi

          rm -rf Payload
          mkdir -p Payload

          cp -R "$APP" Payload/

          rm -f HTVANTIX_8.11_68_unsigned.ipa

          zip -qry \
            HTVANTIX_8.11_68_unsigned.ipa \
            Payload

          echo ""
          echo "===== IPA CREATED ====="
          ls -lh HTVANTIX_8.11_68_unsigned.ipa

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: HTVANTIX-build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HTVANTIX-8.11-68-IPA
          path: HTVANTIX_8.11_68_unsigned.ipa
          if-no-files-found: error
