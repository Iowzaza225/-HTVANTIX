name: Build HTVANTIX IPA

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "*.zip"
      - ".github/workflows/**"

jobs:
  build:
    runs-on: macos-latest

    env:
      HTVANTIX_APP_TOKEN: ${{ secrets.HTVANTIX_APP_TOKEN }}
      BUNDLE_ID: com.apple.mobile.MobileHouseArrest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Xcode version
        run: |
          xcodebuild -version
          swift --version

      - name: Find latest uploaded ZIP
        run: |
          set -e

          echo "Checking ZIP from current commit..."

          ZIP_REL=$(git diff-tree \
            --no-commit-id \
            --name-only \
            -r "$GITHUB_SHA" \
            | grep -E '\.zip$' \
            | head -n 1 || true)

          if [ -z "$ZIP_REL" ]; then
            echo "No ZIP in current commit."
            echo "Finding most recently committed ZIP..."

            ZIP_REL=$(git log \
              --name-only \
              --pretty=format: \
              -- "*.zip" \
              | grep -E '\.zip$' \
              | head -n 1 || true)
          fi

          if [ -z "$ZIP_REL" ]; then
            echo "ERROR: No ZIP found"
            exit 1
          fi

          ZIP_FILE="$GITHUB_WORKSPACE/$ZIP_REL"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP path does not exist:"
            echo "$ZIP_FILE"
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

          echo "========================================"
          echo "THIS RUN WILL BUILD:"
          echo "$ZIP_REL"
          echo "========================================"

      - name: Extract source
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/extracted"
          mkdir -p "$GITHUB_WORKSPACE/extracted"

          unzip -q "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/extracted"

          echo "Extracted:"
          echo "$ZIP_FILE"

      - name: Find Xcode project
        run: |
          set -e

          PROJECT=$(find "$GITHUB_WORKSPACE/extracted" \
            -type d \
            -name "*.xcodeproj" \
            | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Xcode project not found"
            find "$GITHUB_WORKSPACE/extracted" -maxdepth 6 -print
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")
          PROJECT_NAME=$(basename "$PROJECT")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "PROJECT_NAME=$PROJECT_NAME" >> "$GITHUB_ENV"

          echo "Project:"
          echo "$PROJECT"

      - name: Detect scheme
        run: |
          set -e

          cd "$PROJECT_DIR"

          xcodebuild \
            -project "$PROJECT_NAME" \
            -list

          SCHEME=$(xcodebuild \
            -project "$PROJECT_NAME" \
            -list \
            | awk '
              /Schemes:/ {found=1; next}
              found && NF {
                gsub(/^[ \t]+|[ \t]+$/, "")
                print
                exit
              }
            ')

          if [ -z "$SCHEME" ]; then
            echo "ERROR: Scheme not found"
            exit 1
          fi

          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"
          echo "Scheme: $SCHEME"

      - name: Check token
        run: |
          if [ -z "$HTVANTIX_APP_TOKEN" ]; then
            echo "ERROR: HTVANTIX_APP_TOKEN is empty"
            exit 1
          fi

          echo "App token loaded"

      - name: Build
        run: |
          set -o pipefail

          cd "$PROJECT_DIR"

          xcodebuild \
            -project "$PROJECT_NAME" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            HTVANTIX_APP_TOKEN="$HTVANTIX_APP_TOKEN" \
            clean build \
            | tee "$GITHUB_WORKSPACE/xcodebuild.log"

      - name: Find app
        run: |
          set -e

          APP_PATH=$(find "$GITHUB_WORKSPACE/build" \
            -type d \
            -name "*.app" \
            -path "*Release-iphoneos*" \
            | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app not found"
            exit 1
          fi

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          echo "APP: $APP_PATH"

      - name: Fix final Info.plist
        run: |
          set -e

          PLIST="$APP_PATH/Info.plist"

          /usr/libexec/PlistBuddy \
            -c "Delete :CFBundleIdentifier" \
            "$PLIST" 2>/dev/null || true

          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleIdentifier string $BUNDLE_ID" \
            "$PLIST"

          EXECUTABLE_NAME=$(/usr/libexec/PlistBuddy \
            -c "Print :CFBundleExecutable" \
            "$PLIST" 2>/dev/null || true)

          if [ -z "$EXECUTABLE_NAME" ]; then
            EXECUTABLE_NAME=$(basename "$APP_PATH" .app)

            /usr/libexec/PlistBuddy \
              -c "Add :CFBundleExecutable string $EXECUTABLE_NAME" \
              "$PLIST"
          fi

          echo "Bundle ID:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$PLIST"

      - name: Remove old signing
        run: |
          rm -rf "$APP_PATH/_CodeSignature"
          rm -f "$APP_PATH/embedded.mobileprovision"

      - name: Create IPA
        run: |
          set -e

          IPA_NAME="HTVANTIX_${GITHUB_RUN_NUMBER}.ipa"

          rm -rf "$GITHUB_WORKSPACE/ipa"
          mkdir -p "$GITHUB_WORKSPACE/ipa/Payload"

          cp -R "$APP_PATH" \
            "$GITHUB_WORKSPACE/ipa/Payload/"

          cd "$GITHUB_WORKSPACE/ipa"

          zip -qry \
            "$GITHUB_WORKSPACE/$IPA_NAME" \
            Payload

          echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"

          echo "Created:"
          echo "$IPA_NAME"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HTVANTIX-${{ github.run_number }}
          path: ${{ env.IPA_NAME }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HTVANTIX-BUILD-LOG-${{ github.run_number }}
          path: xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
