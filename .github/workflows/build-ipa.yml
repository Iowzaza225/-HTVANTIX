name: Build 3105 IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and Extract ZIP
        run: |
          echo "=== Repository ==="
          ls -la

          ZIP_FILE="$(find . -type f -name "*.zip" | head -1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ไม่พบ ZIP"
            exit 1
          fi

          echo "ZIP: $ZIP_FILE"

          rm -rf extracted
          mkdir extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "=== Xcode Projects ==="
          find extracted -type d -name "*.xcodeproj" -print

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Detect Project
        run: |
          PROJECT="$(find extracted -type d -name "*.xcodeproj" | head -1)"

          if [ -z "$PROJECT" ]; then
            echo "ERROR: ไม่พบ .xcodeproj"
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Project: $PROJECT"

          xcodebuild \
            -project "$PROJECT" \
            -list

      - name: Detect Scheme
        run: |
          SCHEME="$(xcodebuild \
            -project "$PROJECT" \
            -list 2>/dev/null |
            awk '/Schemes:/{flag=1;next} flag && NF {
              gsub(/^[ \t]+|[ \t]+$/, "");
              print;
              exit
            }')"

          if [ -z "$SCHEME" ]; then
            echo "ERROR: ไม่พบ Scheme"
            exit 1
          fi

          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"
          echo "Scheme: $SCHEME"

      - name: Build App
        run: |
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Create IPA
        run: |
          echo "=== Find APP ==="

          APP="$(find build -type d -name "*.app" | head -1)"

          if [ -z "$APP" ]; then
            echo "ERROR: ไม่พบ .app"
            exit 1
          fi

          echo "APP: $APP"

          rm -rf Payload
          mkdir Payload

          cp -R "$APP" Payload/

          /usr/bin/zip -qry \
            3105-Phase3-unsigned.ipa \
            Payload

          echo "=== IPA ==="
          ls -lh 3105-Phase3-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 3105-Phase3-IPA
          path: 3105-Phase3-unsigned.ipa
          if-no-files-found: error
