name: HTVANTIX BUILD

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        shell: bash
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version

      - name: Prepare Source
        shell: bash
        run: |
          set -e

          ZIP_FILE="./HTVANTIX_CLIENT_V1.1.2_BUILD8_ALL_FIX.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ไม่พบ $ZIP_FILE"
            echo "=== ROOT FILES ==="
            ls -lah
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

          rm -rf source
          mkdir -p source
          unzip -q "$ZIP_FILE" -d source

          PROJECT="$(find source -type d -name '*.xcodeproj' -print -quit)"
          if [ -z "$PROJECT" ]; then
            echo "ERROR: ไม่พบ .xcodeproj"
            exit 1
          fi

          INFO_PLIST="$(find source -type f -path '*/ThreeOneOSFive/Info.plist' -print -quit)"
          if [ -z "$INFO_PLIST" ]; then
            echo "ERROR: ไม่พบ Info.plist"
            exit 1
          fi

          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.1.2" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 8" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Set :AppReleaseDisplayVersion 1.1.2" "$INFO_PLIST"

          echo "=== VERSION GATE VALUES ==="
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Print :AppReleaseDisplayVersion" "$INFO_PLIST"

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "SCHEME=3105" >> "$GITHUB_ENV"

          echo "PROJECT: $PROJECT"
          echo "SCHEME: 3105"

      - name: Apply Catalog Display Fix
        shell: bash
        run: |
          set -e
          python3 <<'PY'
          from pathlib import Path

          root = Path('source')
          app = next(root.rglob('ThreeOneOSFive/App.swift'))
          view = next(root.rglob('ThreeOneOSFive/views/PatchProjectsView.swift'))

          app_text = app.read_text()
          old = '''    private var appVersion: String {
              Bundle.main.object(forInfoDictionaryKey: "AppReleaseDisplayVersion") as? String
                  ?? Bundle.main.object(forInfoDictionaryKey: "CFBundleShortVersionString") as? String
                  ?? "1.0"
          }'''
          new = '''    private var appVersion: String {
              Bundle.main.object(forInfoDictionaryKey: "CFBundleShortVersionString") as? String
                  ?? Bundle.main.object(forInfoDictionaryKey: "AppReleaseDisplayVersion") as? String
                  ?? "1.0"
          }'''
          if old in app_text:
              app.write_text(app_text.replace(old, new, 1))

          text = view.read_text()

          old = '''    private var serverVisibleItems: [PatchLibraryItem] {
              let allowedPackageIDs = serverCatalog.visibleLocalPackageIDs
              guard !allowedPackageIDs.isEmpty else { return [] }
              return store.items.filter { item in
                  guard allowedPackageIDs.contains(item.id) else { return false }
                  guard let gameFilter else { return true }
                  return serverCatalog.remoteItem(forLocalPackageID: item.id)?.game == gameFilter
              }
          }

          private var filteredItems: [PatchLibraryItem] {
              let categoryFiltered = serverVisibleItems.filter { item in
                  guard selectedCategory != "all" else { return true }
                  return serverCatalog.remoteItem(forLocalPackageID: item.id)?.category == selectedCategory
              }
              return categoryFiltered
          }'''
          new = '''    private var remoteVisibleItems: [PatchServerCatalog.RemoteItem] {
              serverCatalog.items.filter { remote in
                  if let gameFilter, remote.game != gameFilter { return false }
                  if selectedCategory != "all", remote.category != selectedCategory { return false }
                  return true
              }
          }

          private func localItem(for remote: PatchServerCatalog.RemoteItem) -> PatchLibraryItem? {
              guard let localID = serverCatalog.localPackageID(forRemoteID: remote.id) else { return nil }
              return store.items.first(where: { $0.id == localID })
          }'''
          if old not in text:
              raise SystemExit('catalog property block not found')
          text = text.replace(old, new, 1)

          text = text.replace('if let message = serverCatalog.errorMessage, serverVisibleItems.isEmpty {',
                              'if let message = serverCatalog.errorMessage, serverCatalog.items.isEmpty {', 1)
          text = text.replace('if serverVisibleItems.isEmpty && !store.isBusy && !serverCatalog.isLoading {',
                              'if serverCatalog.items.isEmpty && !store.isBusy && !serverCatalog.isLoading {', 1)
          text = text.replace('} else if filteredItems.isEmpty && !store.isBusy && !serverCatalog.isLoading {',
                              '} else if remoteVisibleItems.isEmpty && !store.isBusy && !serverCatalog.isLoading {', 1)

          old = '''                        Section {
                              ForEach(filteredItems) { item in
                                  patchToggleRow(item)
                                      .listRowSeparator(.hidden)
                                      .listRowBackground(Color.clear)
                              }
                          } header: {'''
          new = '''                        Section {
                              ForEach(remoteVisibleItems) { remote in
                                  if let local = localItem(for: remote) {
                                      patchToggleRow(local)
                                          .listRowSeparator(.hidden)
                                          .listRowBackground(Color.clear)
                                  } else {
                                      remoteCatalogRow(remote)
                                          .listRowSeparator(.hidden)
                                          .listRowBackground(Color.clear)
                                  }
                              }
                          } header: {'''
          if old not in text:
              raise SystemExit('catalog list block not found')
          text = text.replace(old, new, 1)

          old = '''    @MainActor
          private func refreshServerCatalog() async {
              do {
                  let remoteItems = try await serverCatalog.load()
                  for remote in remoteItems {
                      if let expectedID = UUID(uuidString: remote.id),
                         serverCatalog.localPackageID(forRemoteID: remote.id) == expectedID,
                         store.items.contains(where: { $0.id == expectedID }) {
                          continue
                      }
                      let packageID = try await store.importRemotePackageSilently(
                          from: serverCatalog.downloadURL(for: remote),
                          headers: serverCatalog.requestHeaders,
                          preferredPackageID: UUID(uuidString: remote.id)
                      )
                      serverCatalog.bind(remoteID: remote.id, to: packageID)
                  }
                  store.reload()
                  serverCatalog.finishSync()
                  syncActiveStates()
              } catch {
                  serverCatalog.finishSync(error: error)
              }
          }'''
          new = '''    @MainActor
          private func refreshServerCatalog() async {
              do {
                  _ = try await serverCatalog.load()
                  store.reload()
                  serverCatalog.finishSync()
                  syncActiveStates()
              } catch {
                  serverCatalog.finishSync(error: error)
              }
          }'''
          if old not in text:
              raise SystemExit('refresh block not found')
          text = text.replace(old, new, 1)

          marker = '''    @ViewBuilder
          private func patchToggleRow(_ item: PatchLibraryItem) -> some View {'''
          remote_row = '''    @ViewBuilder
          private func remoteCatalogRow(_ remote: PatchServerCatalog.RemoteItem) -> some View {
              HStack(spacing: 14) {
                  ZStack {
                      RoundedRectangle(cornerRadius: 12, style: .continuous)
                          .fill(AppTheme.accent.opacity(0.12))
                          .frame(width: 46, height: 46)
                      Image(systemName: "shippingbox")
                          .font(.system(size: 20, weight: .semibold))
                          .foregroundStyle(AppTheme.accent)
                  }

                  VStack(alignment: .leading, spacing: 4) {
                      Text(remote.name)
                          .font(.body.weight(.semibold))
                          .foregroundStyle(.primary)
                          .lineLimit(1)

                      HStack(spacing: 5) {
                          Text(serverCatalog.gameTitle(remote.game))
                          Text("•")
                          Text(serverCatalog.categoryTitle(remote.category))
                      }
                      .font(.caption)
                      .foregroundStyle(.secondary)
                      .lineLimit(1)

                      if !remote.description.isEmpty {
                          Text(remote.description)
                              .font(.caption2)
                              .foregroundStyle(.secondary)
                              .lineLimit(1)
                      }
                  }

                  Spacer(minLength: 10)

                  Text("v\\(remote.version)")
                      .font(.caption2.monospacedDigit())
                      .foregroundStyle(.secondary)
              }
              .padding(.vertical, 10)
              .padding(.horizontal, 14)
              .background(
                  RoundedRectangle(cornerRadius: 18, style: .continuous)
                      .fill(AppTheme.cardBackground)
              )
              .padding(.vertical, 3)
          }

          @ViewBuilder
          private func patchToggleRow(_ item: PatchLibraryItem) -> some View {'''
          if marker not in text:
              raise SystemExit('row marker not found')
          text = text.replace(marker, remote_row, 1)
          view.write_text(text)
          print('Catalog display fix applied:', view)
          PY

      - name: Verify Scheme
        shell: bash
        run: |
          xcodebuild -project "$PROJECT" -list
          echo "Using scheme: $SCHEME"

      - name: Build HTVANTIX
        shell: bash
        run: |
          set -o pipefail

          rm -rf "$GITHUB_WORKSPACE/build"
          rm -rf "$GITHUB_WORKSPACE/Payload"
          rm -f "$GITHUB_WORKSPACE/HTVANTIX.ipa"
          rm -f "$GITHUB_WORKSPACE/xcodebuild.log"

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            MARKETING_VERSION=1.1.2 \
            CURRENT_PROJECT_VERSION=8 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build \
            2>&1 | tee "$GITHUB_WORKSPACE/xcodebuild.log"

      - name: Verify Built App Version
        shell: bash
        run: |
          APP_PATH="$(find "$GITHUB_WORKSPACE/build" -type d -path '*Release-iphoneos/*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: ไม่พบ .app สำหรับตรวจ version"
            exit 1
          fi
          BUILT_PLIST="$APP_PATH/Info.plist"
          echo "Built CFBundleShortVersionString: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$BUILT_PLIST")"
          echo "Built CFBundleVersion: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$BUILT_PLIST")"
          echo "Built AppReleaseDisplayVersion: $(/usr/libexec/PlistBuddy -c 'Print :AppReleaseDisplayVersion' "$BUILT_PLIST")"

      - name: Create IPA
        shell: bash
        run: |
          APP_PATH="$(find "$GITHUB_WORKSPACE/build" -type d -path '*Release-iphoneos/*.app' -print -quit)"

          if [ -z "$APP_PATH" ]; then
            APP_PATH="$(find "$GITHUB_WORKSPACE/build" -type d -name '*.app' -print -quit)"
          fi

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: ไม่พบ .app"
            exit 1
          fi

          cd "$GITHUB_WORKSPACE"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          /usr/bin/zip -qry HTVANTIX.ipa Payload

          echo "=== IPA CREATED ==="
          ls -lh HTVANTIX.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HTVANTIX-V1.1.2-BUILD8-CATALOG-DISPLAY-FIX-${{ github.run_number }}
          path: HTVANTIX.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Show Errors
        if: failure()
        shell: bash
        run: |
          if [ -f "$GITHUB_WORKSPACE/xcodebuild.log" ]; then
            echo "=== COMPILER ERRORS ==="
            grep -n -i -E 'error:|fatal error:|BUILD FAILED|SwiftCompile|CompileSwift' "$GITHUB_WORKSPACE/xcodebuild.log" | tail -200 || true
          fi

      - name: Upload Build Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: HTVANTIX-V1.1.2-BUILD8-CATALOG-DISPLAY-FIX-LOG-${{ github.run_number }}
          path: xcodebuild.log
          if-no-files-found: ignore
