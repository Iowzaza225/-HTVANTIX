name: Build HTVANTIX IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Repository Files
        run: |
          echo "=== ROOT FILES ==="
          pwd
          ls -la

          echo "=== ZIP FILES ==="
          find . -type f -name "*.zip" -print

      - name: Extract Source ZIP
        run: |
          ZIP_FILE="./HTVANTIX_UI_FF_FFMAX_NO_SCREENSHIELD.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ไม่พบไฟล์ $ZIP_FILE"
            echo "=== ZIP FILES FOUND ==="
            find . -type f -name "*.zip" -print
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "=== EXTRACTED FILES ==="
          find extracted -maxdepth 3 -type f | sort | head -200

          echo "=== XCODE PROJECTS ==="
          find extracted -type d -name "*.xcodeproj" -print

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Detect Xcode Project
        run: |
          PROJECT="$(find extracted -type d -name "*.xcodeproj" | head -1)"

          if [ -z "$PROJECT" ]; then
            echo "ERROR: แตก ZIP แล้ว แต่ไม่พบ .xcodeproj"
            echo "=== DIRECTORY TREE ==="
            find extracted -maxdepth 4 -type d | sort
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT"

          echo "=== PROJECT INFO ==="
          xcodebuild \
            -project "$PROJECT" \
            -list

      - name: Detect Scheme
        run: |
          SCHEME="$(xcodebuild \
            -project "$PROJECT" \
            -list 2>/dev/null |
            awk '/Schemes:/{flag=1;next} flag && NF {
              gsub(/^[ \t]+|[ \t]+$/, "");
              print;
              exit
            }')"

          if [ -z "$SCHEME" ]; then
            echo "ERROR: ไม่พบ Scheme"
            xcodebuild -project "$PROJECT" -list
            exit 1
          fi

          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"
          echo "Using scheme: $SCHEME"

      - name: Build HTVANTIX
        run: |
          echo "=== BUILD SETTINGS ==="
          echo "Project: $PROJECT"
          echo "Scheme: $SCHEME"

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Find Built App
        run: |
          echo "=== BUILT APPS ==="
          find build -type d -name "*.app" -print

      - name: Create IPA
        run: |
          APP="$(find build -type d -name "*.app" | head -1)"

          if [ -z "$APP" ]; then
            echo "ERROR: Build เสร็จ แต่ไม่พบ .app"
            find build -maxdepth 5 -type d | sort | tail -200
            exit 1
          fi

          echo "Using app: $APP"

          rm -rf Payload
          mkdir -p Payload

          cp -R "$APP" Payload/

          /usr/bin/zip -qry \
            HTVANTIX-unsigned.ipa \
            Payload

          echo "=== IPA CREATED ==="
          ls -lh HTVANTIX-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HTVANTIX-IPA
          path: HTVANTIX-unsigned.ipa
          if-no-files-found: error
