name: Build HTVANTIX Premium IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify source ZIP
        shell: bash
        run: |
          SOURCE_ZIP="HTVANTIX_PREMIUM_BLACK_API_FIX_SOURCE.zip"

          if [ ! -f "$SOURCE_ZIP" ]; then
            echo "ERROR: Missing $SOURCE_ZIP"
            exit 1
          fi

          echo "FOUND SOURCE:"
          ls -lh "$SOURCE_ZIP"

      - name: Extract source
        shell: bash
        run: |
          set -e

          rm -rf work
          mkdir -p work

          unzip -q HTVANTIX_PREMIUM_BLACK_API_FIX_SOURCE.zip -d work

          echo "===== XCODE PROJECT ====="
          find work -maxdepth 4 -type d -name "*.xcodeproj" -print

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Detect project and scheme
        shell: bash
        run: |
          PROJECT=$(find work -type d -name "*.xcodeproj" | head -1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Xcode project not found"
            exit 1
          fi

          echo "PROJECT=$PROJECT"

          xcodebuild \
            -project "$PROJECT" \
            -list

      - name: Build HTVANTIX Premium
        shell: bash
        run: |
          set +e

          PROJECT=$(find work -type d -name "*.xcodeproj" | head -1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Xcode project not found"
            exit 1
          fi

          SCHEME=$(xcodebuild \
            -project "$PROJECT" \
            -list \
            -json | \
            python3 -c 'import sys,json; d=json.load(sys.stdin); print(d["project"]["schemes"][0])')

          echo "================================"
          echo "PROJECT = $PROJECT"
          echo "SCHEME  = $SCHEME"
          echo "================================"

          rm -rf build

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build \
            2>&1 | tee build.log

          STATUS=${PIPESTATUS[0]}

          echo ""
          echo "========== REAL XCODE ERRORS =========="
          grep -nE ':[0-9]+:[0-9]+: (error|fatal error):' build.log || true
          echo "======================================="

          exit $STATUS

      - name: Package unsigned IPA
        if: success()
        shell: bash
        run: |
          set -e

          APP=$(find build/DerivedData/Build/Products/Release-iphoneos \
            -maxdepth 1 \
            -type d \
            -name "*.app" \
            | head -1)

          if [ -z "$APP" ]; then
            echo "ERROR: Built .app not found"
            exit 1
          fi

          echo "FOUND APP:"
          echo "$APP"

          rm -rf Payload
          mkdir -p Payload

          cp -R "$APP" Payload/

          rm -f HTVANTIX_PREMIUM_unsigned.ipa

          zip -qry \
            HTVANTIX_PREMIUM_unsigned.ipa \
            Payload

          echo ""
          echo "===== IPA CREATED ====="
          ls -lh HTVANTIX_PREMIUM_unsigned.ipa

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: HTVANTIX-PREMIUM-build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HTVANTIX-PREMIUM-IPA
          path: HTVANTIX_PREMIUM_unsigned.ipa
          if-no-files-found: error
