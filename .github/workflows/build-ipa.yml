name: VIPERXMOD BUILD

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        shell: bash
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version

      - name: Prepare Source
        shell: bash
        run: |
          set -e
          ZIP_FILE="./VIPERXMOD_SOURCE_V1.0.0_BUILD1_BLACK_RED_MULTIAPP.zip"
          test -f "$ZIP_FILE" || { echo "ERROR: ไม่พบ $ZIP_FILE"; ls -lah; exit 1; }
          rm -rf source && mkdir -p source
          unzip -q "$ZIP_FILE" -d source
          PROJECT="$(find source -type d -name '*.xcodeproj' -print -quit)"
          INFO_PLIST="$(find source -type f -path '*/ThreeOneOSFive/Info.plist' -print -quit)"
          test -n "$PROJECT" && test -n "$INFO_PLIST" || { echo "ERROR: source ไม่ครบ"; exit 1; }
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.0" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 1" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Set :AppReleaseDisplayVersion 1.0.0" "$INFO_PLIST"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "SCHEME=3105" >> "$GITHUB_ENV"

      - name: Verify Scheme
        run: xcodebuild -project "$PROJECT" -list

      - name: Build VIPERXMOD
        shell: bash
        run: |
          set -o pipefail
          rm -rf "$GITHUB_WORKSPACE/build" "$GITHUB_WORKSPACE/Payload"
          rm -f "$GITHUB_WORKSPACE/VIPERXMOD.ipa" "$GITHUB_WORKSPACE/xcodebuild.log"
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            MARKETING_VERSION=1.0.0 \
            CURRENT_PROJECT_VERSION=1 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build 2>&1 | tee "$GITHUB_WORKSPACE/xcodebuild.log"

      - name: Create IPA
        shell: bash
        run: |
          APP_PATH="$(find "$GITHUB_WORKSPACE/build" -type d -path '*Release-iphoneos/*.app' -print -quit)"
          test -n "$APP_PATH" || { echo "ERROR: ไม่พบ .app"; exit 1; }
          cd "$GITHUB_WORKSPACE"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -qry VIPERXMOD.ipa Payload
          ls -lh VIPERXMOD.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VIPERXMOD-V1.0.0-BUILD1-${{ github.run_number }}
          path: VIPERXMOD.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Show Errors
        if: failure()
        shell: bash
        run: |
          if [ -f "$GITHUB_WORKSPACE/xcodebuild.log" ]; then
            grep -n -i -E 'error:|fatal error:|BUILD FAILED|SwiftCompile|CompileSwift' "$GITHUB_WORKSPACE/xcodebuild.log" | tail -200 || true
          fi

      - name: Upload Build Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: VIPERXMOD-BUILD-LOG-${{ github.run_number }}
          path: xcodebuild.log
          if-no-files-found: ignore
