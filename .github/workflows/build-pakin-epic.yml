name: PAKIN EPIC Build 19 (unsigned IPA)

on:
  workflow_dispatch:
  push:
    branches:
      - release/pakin-epic-build19
    paths:
      - PAKIN_EPIC_BUILD19_APPID_PAKIN_READY.zip

permissions:
  contents: read

jobs:
  build-pakin:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout PAKIN workspace
        uses: actions/checkout@v4

      - name: Verify PAKIN kit is uploaded
        run: |
          set -euo pipefail
          test -s PAKIN_EPIC_BUILD19_APPID_PAKIN_READY.zip || {
            echo "::error::Upload PAKIN_EPIC_BUILD19_APPID_PAKIN_READY.zip to this release branch before building"
            exit 1
          }

      - name: Extract PAKIN rebrand assets
        run: |
          set -euo pipefail
          mkdir -p brand
          unzip -q -o PAKIN_EPIC_BUILD19_APPID_PAKIN_READY.zip -d brand
          test -s brand/branding/apply_pakin_brand.py
          test -s brand/branding/PakinLicenseGate.swiftpart
          test -s brand/branding/PAKIN_EPIC_LOGO.jpg
          test -s brand/branding/PAKIN_EPIC_APPICON_1024.png
          test -s brand/tests/verify_brand.py
          python3 - <<'PY'
          import pathlib, zipfile
          p=pathlib.Path('PAKIN_EPIC_BUILD19_APPID_PAKIN_READY.zip')
          with zipfile.ZipFile(p) as z:
            assert z.testzip() is None, 'Corrupted PAKIN kit'
            for f in z.namelist():
              pp=pathlib.PurePosixPath(f)
              assert not pp.is_absolute() and '..' not in pp.parts, 'Unsafe archive path'
          print('PAKIN brand kit verified')
          PY

      - name: Checkout pinned RUIZEN Standard Build 17 source
        uses: actions/checkout@v4
        with:
          repository: Iowzaza225/3105
          ref: 3f581de26fb66f44ed26af92a96dedf21daa6007
          path: source
          persist-credentials: false

      - name: Select Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version

      - name: Prepare iOS source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/extracted
          unzip -q -o source/RUIZEN_CLIENT_BUILD10.zip -d work/extracted
          ROOT="$(find "$GITHUB_WORKSPACE/work/extracted" -type d -name ThreeOneOSFive.xcodeproj -print -quit | xargs dirname)"
          test -d "$ROOT/ThreeOneOSFive.xcodeproj"
          cp -R source/overlay/. "$ROOT/"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "PROJECT=$ROOT/ThreeOneOSFive.xcodeproj" >> "$GITHUB_ENV"

      - name: Apply original standard source preparation
        run: |
          set -euo pipefail
          python3 source/ci/apply_branding.py "$ROOT" source/branding/RuizenProfile.jpeg
          python3 source/ci/apply_catalog_status.py "$ROOT"
          python3 source/ci/fix_catalog_origin.py "$ROOT"

      - name: Apply PAKIN EPIC branding and license appId=pakin
        run: |
          set -euo pipefail
          python3 brand/branding/apply_pakin_brand.py "$ROOT" brand/branding
          python3 brand/tests/verify_brand.py "$ROOT"
          xcrun swiftc -frontend -parse "$ROOT/ThreeOneOSFive/App.swift"
          xcrun swiftc -frontend -parse "$ROOT/ThreeOneOSFive/views/DesignSystem.swift"
          xcrun swiftc -frontend -parse "$ROOT/ThreeOneOSFive/views/SettingsView.swift"
          xcodebuild -project "$PROJECT" -list

      - name: Build unsigned iPhone app
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme 3105 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            PRODUCT_NAME=PAKIN_EPIC \
            CURRENT_PROJECT_VERSION=19 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package and verify unsigned IPA
        run: |
          set -euo pipefail
          APP="$(find "$GITHUB_WORKSPACE/build" -type d -name '*.app' -print -quit)"
          test -n "$APP"
          python3 - "$APP" <<'PY'
          import pathlib, plistlib, sys
          app=pathlib.Path(sys.argv[1])
          p=app/'Info.plist'
          info=plistlib.loads(p.read_bytes())
          assert info['CFBundleIdentifier']=='com.apple.mobile.MobileHouseArrest', info['CFBundleIdentifier']
          assert info['CFBundleShortVersionString']=='1.1.6', info.get('CFBundleShortVersionString')
          info['CFBundleDisplayName']='PAKIN EPIC'
          info['CFBundleName']='PAKIN EPIC'
          info['CFBundleVersion']='19'
          p.write_bytes(plistlib.dumps(info,fmt=plistlib.FMT_BINARY))
          for f in app.glob('*.lproj/InfoPlist.strings'):
            try: values=plistlib.loads(f.read_bytes())
            except Exception: continue
            for key in ('CFBundleDisplayName','CFBundleName'):
              if key in values: values[key]='PAKIN EPIC'
            f.write_bytes(plistlib.dumps(values,fmt=plistlib.FMT_BINARY))
          assert (app/info['CFBundleExecutable']).is_file()
          assert list(app.glob('AppIcon*.png')), 'Missing app icon'
          print('Verified:', info['CFBundleIdentifier'], info['CFBundleVersion'])
          PY
          mkdir -p package/Payload
          cp -R "$APP" package/Payload/
          (cd package && /usr/bin/zip -qry ../PAKIN-EPIC-BUILD19-unsigned.ipa Payload)
          python3 - <<'PY'
          import zipfile, plistlib
          with zipfile.ZipFile('PAKIN-EPIC-BUILD19-unsigned.ipa') as z:
            n=next(s for s in z.namelist() if s.startswith('Payload/') and s.count('/')==2 and s.endswith('/Info.plist'))
            info=plistlib.loads(z.read(n))
            assert info['CFBundleDisplayName']=='PAKIN EPIC'
            assert info['CFBundleIdentifier']=='com.apple.mobile.MobileHouseArrest'
            assert info['CFBundleVersion']=='19'
          print('IPA verified')
          PY

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PAKIN-EPIC-BUILD19-unsigned-IPA
          path: PAKIN-EPIC-BUILD19-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
